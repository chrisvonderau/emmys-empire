html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#ffcf6b;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",Nunito,system-ui,sans-serif}
#cv{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;outline:none}
#fruit{position:fixed;inset:0;pointer-events:none;z-index:20}
#fruit #fruitGarden{pointer-events:auto}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#fff3c4,#ffb648);color:#7a3b00;font-weight:900;font-size:28px;z-index:50;transition:opacity .4s}
#boot.off{opacity:0;pointer-events:none}
/* ===== Emmy's Fruit Garden overlay ===== */
#fruitGarden{position:absolute;inset:0;z-index:30;display:none;overflow:hidden;background:#bfe8ff;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#fruitGarden.on{display:block;animation:gdIn .4s ease}
@keyframes gdIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
#gdCV{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#fruitGarden .gdBtn{position:absolute;width:clamp(64px,12vmin,104px);height:clamp(64px,12vmin,104px);padding:0;margin:0;border:0;border-radius:50%;background:transparent;cursor:pointer;outline:none;-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 5px 0 rgba(40,80,40,.18));transition:transform .12s ease;z-index:2}
#fruitGarden .gdBtn svg{width:100%;height:100%;display:block;pointer-events:none}
#fruitGarden .gdBtn:active{transform:scale(.9)}
#fruitGarden .gdBtn.gdFocus{box-shadow:0 0 0 5px #fff,0 0 0 11px #ffb400}
#gdBack{left:max(12px,calc(env(safe-area-inset-left) + 8px));top:max(12px,calc(env(safe-area-inset-top) + 8px))}
#gdWater{right:max(12px,calc(env(safe-area-inset-right) + 8px));bottom:max(12px,calc(env(safe-area-inset-bottom) + 8px))}
#gdWater.pour{animation:gdPour .9s ease}
@keyframes gdPour{0%{transform:rotate(0)}30%,70%{transform:rotate(-24deg)}100%{transform:rotate(0)}}
@media (orientation:portrait){#fruitGarden .gdBtn{width:clamp(64px,15vw,100px);height:clamp(64px,15vw,100px)}}
@media (orientation:landscape) and (max-height:500px){#fruitGarden .gdBtn{width:64px;height:64px}}
@media (prefers-reduced-motion:reduce){#fruitGarden.on,#gdWater.pour{animation:none}}

/* ---- jar item painters (all helpers prefixed jt_) ---- */
const jt_TAU=6.2832;
function jt_grad(c,r,m,d,lo){const g=c.createRadialGradient(-r*0.35,-r*0.4,r*0.1,0,0,r);g.addColorStop(0,lo||"#fff");g.addColorStop(0.2,m);g.addColorStop(1,d);return g;}
function jt_fc(c,r,x,y,rad,col){c.fillStyle=col;c.beginPath();c.arc(x*r,y*r,Math.max(0.6,rad*r),0,jt_TAU);c.fill();}
function jt_fe(c,r,x,y,rx,ry,rot,col){c.fillStyle=col;c.beginPath();c.ellipse(x*r,y*r,Math.max(0.5,rx*r),Math.max(0.5,ry*r),rot||0,0,jt_TAU);c.fill();}
function jt_poly(c,r,p,col){c.fillStyle=col;c.beginPath();c.moveTo(p[0]*r,p[1]*r);for(let i=2;i<p.length;i+=2)c.lineTo(p[i]*r,p[i+1]*r);c.closePath();c.fill();}
function jt_ln(c,r,p,col,w){c.strokeStyle=col;c.lineWidth=Math.max(1,w*r);c.lineCap="round";c.lineJoin="round";c.beginPath();c.moveTo(p[0]*r,p[1]*r);for(let i=2;i<p.length;i+=2)c.lineTo(p[i]*r,p[i+1]*r);c.stroke();}
function jt_dots(c,r,p,rad,col){c.fillStyle=col;c.beginPath();for(let i=0;i<p.length;i+=2){c.moveTo(p[i]*r+rad*r,p[i+1]*r);c.arc(p[i]*r,p[i+1]*r,Math.max(0.6,rad*r),0,jt_TAU);}c.fill();}
function jt_shine(c,r,x,y){c.fillStyle="rgba(255,255,255,.55)";c.beginPath();c.ellipse((x||-0.32)*r,(y||-0.35)*r,r*0.28,r*0.16,-0.5,0,jt_TAU);c.fill();}
function jt_starPath(c,r,R,ri,n,rot,cx,cy){cx=cx||0;cy=cy||0;c.beginPath();for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n,q=(i%2?ri:R)*r;const x=cx*r+Math.cos(a)*q,y=cy*r+Math.sin(a)*q;if(i)c.lineTo(x,y);else c.moveTo(x,y);}c.closePath();}
function jt_eggPath(c,r){c.beginPath();c.moveTo(0,-r*1.04);c.bezierCurveTo(r*0.6,-r*1.04,r*0.9,-r*0.36,r*0.9,r*0.2);c.bezierCurveTo(r*0.9,r*0.7,r*0.52,r*0.99,0,r*0.99);c.bezierCurveTo(-r*0.52,r*0.99,-r*0.9,r*0.7,-r*0.9,r*0.2);c.bezierCurveTo(-r*0.9,-r*0.36,-r*0.6,-r*1.04,0,-r*1.04);c.closePath();}
function jt_wave(c,r,y,amp,n,col,w,x0,x1){x0=x0===undefined?-1:x0;x1=x1===undefined?1:x1;c.strokeStyle=col;c.lineWidth=Math.max(1,w*r);c.lineCap="round";c.lineJoin="round";c.beginPath();const st=(x1-x0)/n;for(let i=0;i<=n;i++){const x=(x0+i*st)*r,yy=(y+(i%2?amp:-amp))*r;if(i)c.lineTo(x,yy);else c.moveTo(x,yy);}c.stroke();}
function jt_rays(c,r,n,r0,r1,r2,col,rot){c.fillStyle=col;c.beginPath();for(let i=0;i<n;i++){const a=(rot||0)+i*jt_TAU/n,h=Math.PI/n*0.55,R=(i%2?r2:r1)*r;c.moveTo(Math.cos(a-h)*r0*r,Math.sin(a-h)*r0*r);c.lineTo(Math.cos(a)*R,Math.sin(a)*R);c.lineTo(Math.cos(a+h)*r0*r,Math.sin(a+h)*r0*r);}c.fill();}
function jt_flower(c,r,x,y,s,col){c.fillStyle=col;c.beginPath();for(let i=0;i<5;i++){const a=i*1.2566,px=(x+Math.cos(a)*s)*r,py=(y+Math.sin(a)*s)*r;c.moveTo(px+s*0.8*r,py);c.arc(px,py,s*0.8*r,0,jt_TAU);}c.fill();jt_fc(c,r,x,y,s*0.6,"#ffe14d");}
function jt_heart(c,r,x,y,s,col){c.fillStyle=col;c.beginPath();c.moveTo(x*r,(y+s*0.9)*r);c.bezierCurveTo((x-s*1.3)*r,(y-s*0.1)*r,(x-s*0.6)*r,(y-s*1.1)*r,x*r,(y-s*0.35)*r);c.bezierCurveTo((x+s*0.6)*r,(y-s*1.1)*r,(x+s*1.3)*r,(y-s*0.1)*r,x*r,(y+s*0.9)*r);c.fill();}
function jt_twinkle(c,r,x,y,s,col){c.fillStyle=col;c.beginPath();c.moveTo(x*r,(y-s)*r);c.quadraticCurveTo(x*r,y*r,(x+s)*r,y*r);c.quadraticCurveTo(x*r,y*r,x*r,(y+s)*r);c.quadraticCurveTo(x*r,y*r,(x-s)*r,y*r);c.quadraticCurveTo(x*r,y*r,x*r,(y-s)*r);c.fill();}
function jt_flake(c,r,x,y,s,col){for(let i=0;i<3;i++){const a=i*1.0472,dx=Math.cos(a)*s,dy=Math.sin(a)*s;jt_ln(c,r,[x-dx,y-dy,x+dx,y+dy],col,0.045);}}
function jt_body(c,r,m,d,lo){c.beginPath();c.arc(0,0,r,0,jt_TAU);c.fillStyle=jt_grad(c,r,m,d,lo);c.fill();}
function jt_clipCircle(c,r,k){c.beginPath();c.arc(0,0,r*(k||1),0,jt_TAU);c.clip();}

function tone(t,f,type,a,d,g,out,o){
  o=o||NO;a=Math.max(.002,a);d=Math.max(.01,d);

  if(o.f2)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+(o.ft||a+h+d));
  if(o.det)osc.detune.setValueAtTime(o.det,t);

  if(o.ff){var b=bq(o.flt||"lowpass",o.ff,o.fq||.7,t);
    if(o.ff2)b.frequency.exponentialRampToValueAtTime(Math.max(20,o.ff2),t+(o.fft||a+h+d));
    osc.connect(b);src=b;}
  g=Math.max(.0002,g);
  gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(g,t+a);
  if(h)gn.gain.setValueAtTime(g,t+a+h);

    lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(o.vibd||15,t+Math.min(.25,a+h+d));
    l.connect(lg);lg.connect(osc.detune);l.start(t);l.stop(end+.05);}

}

function noise(t,a,d,g,out,o){
  o=o||NO;a=Math.max(.001,a);d=Math.max(.01,d);

function parseMel(str,key,name){

  for(var i=0;i<32;i++){var s=tk[i]||".";
    if(s==="-"){if(last)last.d+=2;continue;}

function parseChord(tok,key,name){

function schedStep(pl,s,t){

    if(c!=="."){v=c==="X"?1:c==="g"?.35:.75;DRUM[l.k](tt,v*l.g,o);}}

    else if(c==="r"){for(i=0;i<ch.cn.length;i++)INST[l.i](tt+i*.014,ch.cn[i]+oc,2*sd,g*(1-i*.12),o);}

}
function tick(){
  if(!AC){stopTimer();return;}
  applyVolume();
  var now=AC.currentTime;
  for(var i=players.length-1;i>=0;i--){var p=players[i];
    if(p.stopAt&&now>=p.stopAt){killPlayer(p);players.splice(i,1);continue;}
    if(p.next<now-.05)p.next=now+.03;           // tab was asleep: skip ahead instead of a burst of notes
    var total=p.def.form.length*64, guard=0;
    while(p.next<now+LOOK&&(!p.stopAt||p.next<p.stopAt)&&guard++<64){
      try{schedStep(p,p.step,p.next);}catch(e){if(window.console)console.warn("music step",e);}
      p.step++;if(p.step>=total){p.step=0;p.pass++;}
      p.next+=60/p.def.bpm/4;}
  }
  if(!players.length)stopTimer();
}
function startTimer(){if(!timer)timer=window.setInterval(tick,25);}
function stopTimer(){if(timer){window.clearInterval(timer);timer=0;}}

/* gamepads */
const BTN_IDX={A:0,B:1,X:2,Y:3,LB:4,RB:5,start:9,up:12,down:13,left:14,right:15};
const IDX_BTN={};for(const k in BTN_IDX)IDX_BTN[BTN_IDX[k]]=k;
const slots=[null,null];const padSt=[mkPadSt(),mkPadSt()];

function listPads(){try{const n=window.navigator;const l=n&&n.getGamepads?n.getGamepads():null;return l?Array.prototype.slice.call(l):[];}catch(e){return [];}}
function dz(v){v=num(v,0);const d=.2;if(Math.abs(v)<d)return 0;return Math.sign(v)*Math.min(1,(Math.abs(v)-d)/(1-d));}
FPJ.padAxis=pad=>{const st=padSt[pad];return st?{x:st.ax.x,y:st.ax.y}:{x:0,y:0};};
FPJ.padCount=()=>(slots[0]!=null?1:0)+(slots[1]!=null?1:0);
function pressedB(b){return !!b&&(b.pressed===true||(typeof b==="object"&&num(b.value,0)>.5)||b===1);}
function pollPads(dt){const list=listPads();
 for(let s=0;s<2;s++){const gi=slots[s];if(gi==null)continue;const gp=list[gi];if(!gp||gp.connected===false){slots[s]=null;padSt[s]=mkPadSt();delete joinedPads[s];dispatch({type:"padleave",pad:s});}}
 for(const gp of list){if(!gp||gp.connected===false)continue;const gi=gp.index!=null?gp.index:list.indexOf(gp);if(slots[0]===gi||slots[1]===gi)continue;
  const s=slots[0]==null?0:slots[1]==null?1:-1;if(s<0)break;slots[s]=gi;padSt[s]=mkPadSt();dispatch({type:"padjoin",pad:s});}
 const gOpen=gardenOpen();
 for(let s=0;s<2;s++){const gi=slots[s];if(gi==null)continue;const gp=list[gi];if(!gp)continue;const st=padSt[s];
  const bs=gp.buttons||[],now=[];for(let i=0;i<17;i++)now[i]=pressedB(bs[i]);
  const ax=gp.axes||[];st.ax.x=dz(ax[0]);st.ax.y=dz(ax[1]);
  for(const k in BTN_IDX)st.held[k]=now[BTN_IDX[k]];
  const edges=[];for(let i=0;i<17;i++)edges[i]=now[i]&&!st.prev[i];
  if(edges.some(x=>x))unlockAudio();if(edges[0]&&!gOpen)joinedPads[s]=true;
  // direction with repeat (stick or dpad)
  let d=null;const sx=num(ax[0],0),sy=num(ax[1],0);

  else if(Math.abs(sx)>.55||Math.abs(sy)>.55)d=Math.abs(sx)>Math.abs(sy)?(sx<0?"left":"right"):(sy<0?"up":"down");

  for(const i of [0,1,2,3,4,5,9])if(edges[i])dispatch({type:"btn",btn:IDX_BTN[i],pad:s});

function updatePlay(dt){const g=G;g.t+=dt;FPJ.game=g;
 if(g.tipQ.length&&!FPJ.overlay){g.tipT-=dt;if(g.tipT<=0){const t=g.tipQ.shift();ui("toast",t.text,{icon:t.icon,ms:2600});g.tipT=2.8;}}
 // shown score counts up
 g.shown=g.shown<g.score?Math.min(g.score,g.shown+Math.max(1,(g.score-g.shown)*dt*8)):g.score;
 if(FPJ.overlay||gardenOpen())return;  // paused while a card or the garden is up
 const ts=clamp(num(fx("timeScale"),1),0.05,1);const sdt=dt*ts;
 if(g.gigT>0)g.gigT-=dt;
 g.stateT+=dt;
 if(g.state==="intro"){if(g.introDone||g.stateT>8){g.state="play";g.stateT=0;music("boss");FPJ.say(g.boss.name+" is here! Make matches to splash juice!");tip("boss","Make matches to splash the boss with juice!","crown");}
  else{simulate(sdt);return;}}
 // aim (keyboard held + controller sticks)
 for(const d of g.drop){if(d.cool>0)d.cool-=dt;if(d.pop<1)d.pop=Math.min(1,d.pop+dt*5);
  let ax=0;if(d.pad<0){if(FPJ.held(-1,"left"))ax-=1;if(FPJ.held(-1,"right"))ax+=1;}
  else{ax=FPJ.padAxis(d.pad).x;if(FPJ.held(d.pad,"left"))ax=-1;if(FPJ.held(d.pad,"right"))ax=1;}
  if(ax)d.u=clamp(d.u+ax*dt*0.95,0,1);}
 for(const f of g.floaters){f.t+=dt;}
 for(let i=g.floaters.length-1;i>=0;i--){const f=g.floaters[i];if(f.t>=f.dur){g.floaters.splice(i,1);if(f.onDone)f.onDone();}}
 if(g.state==="finale"){simulate(sdt);updateFinale(dt);return;}
 if(g.state==="blend"){updateBlend(dt);return;}
 simulate(sdt);
 if(g.comboT>0){g.comboT-=sdt;if(g.comboT<=0){g.combo=0;g.chainHit=false;g.chainPow=false;}}
 g.sinceMerge+=sdt;
 if(g.boss)updateBoss(dt,sdt);
 updateShots(dt);
 if(g.state==="play"){updateDanger(sdt);if(!g.goalDone&&!g.endless&&!g.boss&&progress()>=1)completeLevel();
  if(g.endless){if(g.score>=g.rollAt)rollWorld();if(g.score>=g.powerAt){g.powerAt+=1500;rewardPower(g.rect.x+g.rect.w/2,g.rect.y+g.rect.h*0.3,"Bonus power-up!");}}}
 else if(g.state==="celebrate"){if(g.stateT>=1.7)finishLevel(false);}
 else if(g.state==="over"){if(g.stateT>=1.0&&!g.overSent){g.overSent=true;sendOver();}}

function simulate(dt){const g=G;if(dt<=0)return;
 const sub=4,h=dt/sub;
 for(let k=0;k<sub;k++){integrate(h);for(let it=0;it<4;it++){pairs(it===0);walls(it===0);}detect();tickMerges(h);}
 // per-frame bookkeeping
 const s=g.s;let bumped=false;
 for(let i=g.items.length-1;i>=0;i--){const a=g.items[i];if(a.dead){g.items.splice(i,1);continue;}
  a.age+=dt;if(a.px!=null){const ry=(a.y-a.py)/dt,rx=(a.x-a.px)/dt;a.rs=a.rs==null?Math.hypot(rx,ry):a.rs*.7+Math.hypot(rx,ry)*.3;}a.px=a.x;a.py=a.y;if(a.pop<1)a.pop=Math.min(1,a.pop+dt*5);if(a.squash>0)a.squash=Math.max(0,a.squash-dt*4);
  if(a.cheer>0)a.cheer-=dt;if(a.gig>0)a.gig-=dt;a.blink-=dt;if(a.blink<-0.15)a.blink=rnd(2,6);
  const sp=num(a.rs,99);if(sp<12*s&&!a.mg)a.still+=dt;else a.still=0;
  if(a.still>.2&&a.landed){const vm=Math.max(sp*1.5,30*s),v=Math.hypot(a.vx,a.vy);if(v>vm){a.vx*=vm/v;a.vy*=vm/v;}}
  if(a.sleep&&(sp>80*s||a.gig>0||a.cheer>0)){a.sleep=false;a.still=0;}
  if(!a.sleep&&a.kind==="item"&&a.still>9&&a.gig<=0&&a.cheer<=0){a.sleep=true;if(g.sleepSfxT<=0){g.sleepSfxT=10;}}
  if(a.kind==="bomb"&&a.fuse>=0){a.fuse-=dt;if(a.fuse<=0)explode(a);}
  if(!isFinite(a.x)||!isFinite(a.y)||!isFinite(a.vx)||!isFinite(a.vy))clampIn(a);
  if(a.y>H+400||a.y<-2000)a.dead=true;}
 if(g.sleepSfxT>0)g.sleepSfxT-=dt;if(g.landSfxT>0)g.landSfxT-=dt;
 if(g.shakeT>0){g.shakeT-=dt;g.shakeKick-=dt;if(g.shakeKick<=0){g.shakeKick=.16;for(const a of g.items){if(a.mg)continue;a.vy-=rnd(120,320)*s;a.vx+=rnd(-160,160)*s;}}
  if(g.shakeT<=0){addScore(100,g.rect.x+g.rect.w/2,g.rect.y+g.rect.h*0.5,"Tidy! +100");}}}
function integrate(h){const g=G,s=g.s,gr=1900*s,vmax=2600*s;
 for(const a of g.items){if(a.dead||a.mg)continue;a.cx=0;a.cy=0;a.vy+=gr*h;a.vx*=1-1.1*h;a.vy*=1-0.05*h;
  const v=Math.hypot(a.vx,a.vy);if(v>vmax){a.vx*=vmax/v;a.vy*=vmax/v;}
  a.x+=a.vx*h;a.y+=a.vy*h;a.rot+=a.vx/Math.max(4,a.r)*h;if(a.rot>TAU||a.rot<-TAU)a.rot%=TAU;}}
function walls(first){const g=G,R=g.rect,s=g.s,L=R.x,Rt=R.x+R.w,F=R.y+R.h;
 for(const a of g.items){if(a.dead||a.mg)continue;
  if(a.x-a.r<L){a.x=L+a.r;if(a.vx<0)a.vx=-a.vx*.15;}
  if(a.x+a.r>Rt){a.x=Rt-a.r;if(a.vx>0)a.vx=-a.vx*.15;}
  if(a.y+a.r>F){a.y=F-a.r;
   if(first){if(a.vy>0){if(a.vy>320*s)landFx(a);a.squash=Math.min(.25,a.vy/(1100*s));a.vy=-a.vy*.16;if(a.vy>-24*s)a.vy=0;}a.vx*=.86;}
   else if(a.vy>0)a.vy=0;
   a.landed=true;if(a.kind==="bomb"&&a.fuse<0)a.fuse=.3;}}}
function landFx(a){const g=G;if(!a.landed&&g.landSfxT<=0){sfx("land");g.landSfxT=.07;}a.gig=Math.max(a.gig,.5);}
function pairs(first){const g=G,a=g.items,n=a.length,bump=-260*g.s;
 for(let i=0;i<n;i++){const A=a[i];if(A.dead||A.mg)continue;
  for(let j=i+1;j<n;j++){const B=a[j];if(B.dead||B.mg)continue;
   const dx=B.x-A.x,dy=B.y-A.y,min=A.r+B.r;if(dx>min||dx<-min||dy>min||dy<-min)continue;
   const d2=dx*dx+dy*dy;if(d2>=min*min)continue;const d=Math.sqrt(d2)||0.0001;
   const nx=d2>0?dx/d:0,ny=d2>0?dy/d:1,ov=min-d,m1=A.r*A.r,m2=B.r*B.r,tm=m1+m2;
   const ka=ov*(m2/tm),kb=ov*(m1/tm);A.x-=nx*ka;A.y-=ny*ka;B.x+=nx*kb;B.y+=ny*kb;A.cx-=nx*ka;A.cy-=ny*ka;B.cx+=nx*kb;B.cy+=ny*kb;
   if(A.landed||B.landed){if(!A.landed&&A.vy>320*g.s)landFx(A);if(!B.landed&&B.vy>320*g.s)landFx(B);A.landed=B.landed=true;}
   if(A.kind==="bomb"&&A.fuse<0)A.fuse=.3;if(B.kind==="bomb"&&B.fuse<0)B.fuse=.3;
   const rv=(B.vx-A.vx)*nx+(B.vy-A.vy)*ny;
   if(first&&rv<bump){A.gig=Math.max(A.gig,.8);B.gig=Math.max(B.gig,.8);A.sleep=B.sleep=false;if(g.gigT<=0&&g.state==="play"){g.gigT=1.6;sfx("giggle");}}
   if(rv<0){const e=first?.16:0,jimp=-(1+e)*rv/(1/m1+1/m2);A.vx-=jimp/m1*nx;A.vy-=jimp/m1*ny;B.vx+=jimp/m2*nx;B.vy+=jimp/m2*ny;}
   if(!first)continue;
   const tx=-ny,ty=nx,tv=(B.vx-A.vx)*tx+(B.vy-A.vy)*ty;
   if(tv){const jf=tv*.25/(1/m1+1/m2);A.vx+=jf/m1*tx;A.vy+=jf/m1*ty;B.vx-=jf/m2*tx;B.vy-=jf/m2*ty;}}}}
function detect(){const g=G;if(g.state!=="play"&&g.state!=="celebrate"&&g.state!=="intro")return;const a=g.items,n=a.length;
 const slop=(g.shakeT>0?12:g.hard?2:5)*g.s;
 for(let i=0;i<n;i++){const A=a[i];if(A.dead||A.mg||A.nm)continue;
  for(let j=i+1;j<n;j++){const B=a[j];if(B.dead||B.mg||B.nm||A.mg)continue;
   const lim=A.r+B.r+slop,dx=B.x-A.x,dy=B.y-A.y;if(dx>lim||dx<-lim||dy>lim||dy<-lim||dx*dx+dy*dy>lim*lim)continue;
   const ka=A.kind,kb=B.kind;
   if(ka==="item"&&kb==="item"){if(A.tier===B.tier)beginMerge(A,B,A.tier>=MAXT?"mega":"merge",A.tier+1);continue;}
   if(ka==="pit"&&kb==="pit"){beginMerge(A,B,"pits",0);continue;}
   if(ka==="rainbow"||kb==="rainbow"){const R=ka==="rainbow"?A:B,O=R===A?B:A;

function beginMerge(A,B,type,nt){A.mg=B.mg=true;const m={a:A,b:B,type,nt,t:0,mx:(A.x+B.x)/2,my:(A.y+B.y)/2,vx:(A.vx+B.vx)*.25,vy:Math.min(0,(A.vy+B.vy)*.2)};

function tickMerges(h){const g=G;

function cupLayout(){const g=G,R=g.rect;const room=W-(R.x+R.w);let x,y,h;
 if(room>=W*.24){h=Math.min(H*.55,room*1.25);x=R.x+R.w+room/2;y=R.y+R.h-h/2;}
 else{h=Math.min(H*.46,W*.62);x=W/2;y=H-h/2-14;}
 return {x,y,h,mx:x,my:y-h*.36};}
function startFinale(){const g=G,f=g.fin||(g.fin={});g.state="finale";g.stateT=0;f.t=0;f.cupIn=0;f.fill=0;f.swirl=0;f.cream=0;f.straw=0;f.cherry=0;f.face="none";
 f.cols=liquid(g.w);f.flying=[];f.arrived=0;f.ev={};g.boss.stage="finale";g.boss.mood="happy";
 for(const a of g.items){if(!a.dead&&a.kind!=="item"){a.dead=true;fx("splash",a.x,a.y,"#d8dde2",.6);}}
 const its=g.items.filter(a=>!a.dead).sort((a,b)=>a.y-b.y);g.merges.length=0;
 const R=g.rect;f.queue=its.map(a=>({kind:a.kind,tier:a.tier,u:(a.x-R.x)/R.w,v:(R.y+R.h-a.y)/R.w,r:a.r/g.s,src:a}));
 if(f.queue.length<6){for(let i=f.queue.length;i<8;i++)f.queue.push({kind:"item",tier:i%5,u:rnd(.15,.85),v:rnd(.05,.4),r:radius(i%5)/g.s,src:null});}
 for(const a of g.items)a.mg=true;f.total=f.queue.reduce((s,q)=>s+(q.kind==="item"?q.tier+1:.5),0);
 f.iv=clamp(3/f.queue.length,.07,.2);f.launchT=.8;
 music("finale");sfx("whoosh");FPJ.say("Smoothie time!");fx("floatText",W/2,H*.18,"SMOOTHIE TIME!","#ffffff",48);}
function finEv(f,k){if(f.ev[k])return false;f.ev[k]=1;return true;}
function updateFinale(dt){const g=G,f=g.fin;f.t+=dt;const t=f.t,cup=cupLayout();
 f.cupIn=easeBack(clamp(t/.7,0,1));f.swirl+=dt*(1+(f.blendT>0?10:0));
 // launch items one by one in arcs
 if(t>=f.launchT&&f.queue.length){f.launchT=t+f.iv;const q=f.queue.shift();if(q.src){q.src.dead=true;}
  const R=g.rect;q.x0=R.x+q.u*R.w;q.y0=R.y+R.h-q.v*R.w;q.t=0;q.dur=.75;q.rot=0;f.flying.push(q);
  if(Math.random()<.35)sfx("giggle");else sfx("pop");fx("sparkle",q.x0,q.y0,q.kind==="item"?itemColor(g.w,q.tier):"#cccccc",6);}
 for(const q of f.flying){q.t+=dt;q.rot+=dt*8;}
 for(let i=f.flying.length-1;i>=0;i--){const q=f.flying[i];if(q.t<q.dur)continue;f.flying.splice(i,1);f.arrived+=q.kind==="item"?q.tier+1:.5;
  f.fill=clamp(.9*f.arrived/Math.max(1,f.total),0,.9);const col=q.kind==="item"?itemColor(g.w,q.tier):f.cols[0];fx("splash",cup.mx,cup.my,col,.7);sfx("merge",Math.min(10,q.kind==="item"?q.tier:0));}
 const allIn=!f.queue.length&&!f.flying.length&&t>1;
 if(allIn&&f.blendStart==null){f.blendStart=t;sfx("blend");fx("shake",3,1.6);rumbleAll(1500,.25);fx("floatText",cup.x,cup.y-cup.h*.7,"Whirr!","#ffffff",36);}
 if(f.blendStart!=null){const bt=t-f.blendStart;f.blendT=bt<1.6?1:0;f.fill=lerp(f.fill,1,clamp(dt*2,0,1));
  if(bt>1.7){f.cream=Math.min(1,f.cream+dt/.35);if(finEv(f,"cream")){sfx("boing");fx("sparkle",cup.x,cup.y-cup.h*.5,"#ffffff",16);}}
  if(bt>2.15){f.straw=Math.min(1,f.straw+dt/.35);if(finEv(f,"straw"))sfx("whoosh");}
  if(bt>2.6){f.cherry=Math.min(1,f.cherry+dt/.35);if(finEv(f,"cherry")){sfx("pop");f.face="yum";fx("flash","#ffffff",.35);sfx("win");
    for(let k=0;k<3;k++)fx("confetti",W*(.2+k*.3),-10,90);fx("confetti",cup.x,cup.y-cup.h*.5,80);rumbleAll(300,.5);
    const bl=blendName(g.w);FPJ.say("Yum! A "+bl+"!");fx("floatText",cup.x,cup.y-cup.h*.85,"Yum!","#ffffff",56);}}
  if(bt>4.0&&finEv(f,"unlock")){f.face="wow";const r=f.result||{};
   if(r.unlocked!=null){sfx("unlock");fx("floatText",W/2,H*.3,WORLD_NAMES[r.unlocked]+" unlocked!","#ffd23f",38);fx("confetti",W/2,-10,100);}
   else sfx("chime");
   if(r.sticker!=null)setTimeoutG(()=>{sfx("sticker");fx("floatText",W/2,H*.4,"New sticker!","#ff6fae",36);},.6);}
  if(bt>5.6&&finEv(f,"win")){const r=f.result||{};g.state="done";
   ui("win",{w:g.w,n:4,stars:f.stars,score:g.score,best:P.best[key(g.w,4)],newBest:!!r.newBest,worldCleared:true,next:nextOf(g.w,4),endless:false,sticker:r.sticker,unlocked:r.unlocked});}}}

function moodOf(a){if(a.mg||a.cheer>0)return "cheer";if(a.gig>0)return "giggle";if(a.worried&&G.state==="play")return "worried";if(a.sleep)return "sleep";if(a.blink<0)return "blink";return "smile";}

function drawDroppers(c){const g=G,R=g.rect,t=FPJ.t;
 // next-up bubble

 c.save();c.globalAlpha=.85;c.fillStyle="rgba(255,255,255,.55)";c.beginPath();c.arc(nx,ny,nr*1.35,0,TAU);c.fill();c.globalAlpha=1;

 drawThing(c,"item",g.w,g.next,nx,ny,nr,0,"smile",0);
 const multi=g.drop.length>1;
 for(const d of g.drop){const r=d.kind==="item"?radius(d.tier):specialR(d.kind),x=dropX(d,r),bob=Math.sin(t*3.8+d.i)*r*.06,y=g.dropY+bob;
  // aim line to the first thing below

  c.save();c.strokeStyle=d.color;c.globalAlpha=.55;c.lineWidth=Math.max(2,3*g.s);try{c.setLineDash([8*g.s+2,8*g.s+2]);}catch(e){}c.beginPath();c.moveTo(x,y+r);c.lineTo(x,Math.max(y+r,ly));c.stroke();try{c.setLineDash([]);}catch(e){}
  c.globalAlpha=.25;c.fillStyle=d.color;c.beginPath();c.ellipse(x,ly,r*.7,Math.max(2,r*.16),0,0,TAU);c.fill();
