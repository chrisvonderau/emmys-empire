/* ---- jar item painters (all helpers prefixed jt_) ---- */
const jt_TAU=6.2832;
function jt_grad(c,r,m,d,lo){const g=c.createRadialGradient(-r*0.35,-r*0.4,r*0.1,0,0,r);g.addColorStop(0,lo||"#fff");g.addColorStop(0.2,m);g.addColorStop(1,d);return g;}
function jt_fc(c,r,x,y,rad,col){c.fillStyle=col;c.beginPath();c.arc(x*r,y*r,Math.max(0.6,rad*r),0,jt_TAU);c.fill();}
function jt_fe(c,r,x,y,rx,ry,rot,col){c.fillStyle=col;c.beginPath();c.ellipse(x*r,y*r,Math.max(0.5,rx*r),Math.max(0.5,ry*r),rot||0,0,jt_TAU);c.fill();}
function jt_poly(c,r,p,col){c.fillStyle=col;c.beginPath();c.moveTo(p[0]*r,p[1]*r);for(let i=2;i<p.length;i+=2)c.lineTo(p[i]*r,p[i+1]*r);c.closePath();c.fill();}
function jt_ln(c,r,p,col,w){c.strokeStyle=col;c.lineWidth=Math.max(1,w*r);c.lineCap="round";c.lineJoin="round";c.beginPath();c.moveTo(p[0]*r,p[1]*r);for(let i=2;i<p.length;i+=2)c.lineTo(p[i]*r,p[i+1]*r);c.stroke();}
function jt_dots(c,r,p,rad,col){c.fillStyle=col;c.beginPath();for(let i=0;i<p.length;i+=2){c.moveTo(p[i]*r+rad*r,p[i+1]*r);c.arc(p[i]*r,p[i+1]*r,Math.max(0.6,rad*r),0,jt_TAU);}c.fill();}
function jt_shine(c,r,x,y){c.fillStyle="rgba(255,255,255,.55)";c.beginPath();c.ellipse((x||-0.32)*r,(y||-0.35)*r,r*0.28,r*0.16,-0.5,0,jt_TAU);c.fill();}
function jt_starPath(c,r,R,ri,n,rot,cx,cy){cx=cx||0;cy=cy||0;c.beginPath();for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n,q=(i%2?ri:R)*r;const x=cx*r+Math.cos(a)*q,y=cy*r+Math.sin(a)*q;if(i)c.lineTo(x,y);else c.moveTo(x,y);}c.closePath();}
function jt_eggPath(c,r){c.beginPath();c.moveTo(0,-r*1.04);c.bezierCurveTo(r*0.6,-r*1.04,r*0.9,-r*0.36,r*0.9,r*0.2);c.bezierCurveTo(r*0.9,r*0.7,r*0.52,r*0.99,0,r*0.99);c.bezierCurveTo(-r*0.52,r*0.99,-r*0.9,r*0.7,-r*0.9,r*0.2);c.bezierCurveTo(-r*0.9,-r*0.36,-r*0.6,-r*1.04,0,-r*1.04);c.closePath();}
function jt_wave(c,r,y,amp,n,col,w,x0,x1){x0=x0===undefined?-1:x0;x1=x1===undefined?1:x1;c.strokeStyle=col;c.lineWidth=Math.max(1,w*r);c.lineCap="round";c.lineJoin="round";c.beginPath();const st=(x1-x0)/n;for(let i=0;i<=n;i++){const x=(x0+i*st)*r,yy=(y+(i%2?amp:-amp))*r;if(i)c.lineTo(x,yy);else c.moveTo(x,yy);}c.stroke();}
function jt_rays(c,r,n,r0,r1,r2,col,rot){c.fillStyle=col;c.beginPath();for(let i=0;i<n;i++){const a=(rot||0)+i*jt_TAU/n,h=Math.PI/n*0.55,R=(i%2?r2:r1)*r;c.moveTo(Math.cos(a-h)*r0*r,Math.sin(a-h)*r0*r);c.lineTo(Math.cos(a)*R,Math.sin(a)*R);c.lineTo(Math.cos(a+h)*r0*r,Math.sin(a+h)*r0*r);}c.fill();}
function jt_flower(c,r,x,y,s,col){c.fillStyle=col;c.beginPath();for(let i=0;i<5;i++){const a=i*1.2566,px=(x+Math.cos(a)*s)*r,py=(y+Math.sin(a)*s)*r;c.moveTo(px+s*0.8*r,py);c.arc(px,py,s*0.8*r,0,jt_TAU);}c.fill();jt_fc(c,r,x,y,s*0.6,"#ffe14d");}
function jt_heart(c,r,x,y,s,col){c.fillStyle=col;c.beginPath();c.moveTo(x*r,(y+s*0.9)*r);c.bezierCurveTo((x-s*1.3)*r,(y-s*0.1)*r,(x-s*0.6)*r,(y-s*1.1)*r,x*r,(y-s*0.35)*r);c.bezierCurveTo((x+s*0.6)*r,(y-s*1.1)*r,(x+s*1.3)*r,(y-s*0.1)*r,x*r,(y+s*0.9)*r);c.fill();}
function jt_twinkle(c,r,x,y,s,col){c.fillStyle=col;c.beginPath();c.moveTo(x*r,(y-s)*r);c.quadraticCurveTo(x*r,y*r,(x+s)*r,y*r);c.quadraticCurveTo(x*r,y*r,x*r,(y+s)*r);c.quadraticCurveTo(x*r,y*r,(x-s)*r,y*r);c.quadraticCurveTo(x*r,y*r,x*r,(y-s)*r);c.fill();}
function jt_flake(c,r,x,y,s,col){for(let i=0;i<3;i++){const a=i*1.0472,dx=Math.cos(a)*s,dy=Math.sin(a)*s;jt_ln(c,r,[x-dx,y-dy,x+dx,y+dy],col,0.045);}}
function jt_body(c,r,m,d,lo){c.beginPath();c.arc(0,0,r,0,jt_TAU);c.fillStyle=jt_grad(c,r,m,d,lo);c.fill();}
function jt_clipCircle(c,r,k){c.beginPath();c.arc(0,0,r*(k||1),0,jt_TAU);c.clip();}

/* ---- fruit: port of fruitPaint body ---- */
function jt_fruit(c,t,r,m,d){
 c.beginPath();
 if(t===5){c.ellipse(0,r*0.12,r*0.86,r*0.9,0,0,6.28);}else if(t===7){c.ellipse(0,0,r*0.82,r,0,0,6.28);}else if(t===8){c.rotate(-.2);c.ellipse(0,0,r*1.05,r*0.86,0,0,6.28);c.rotate(.2);}
 else c.arc(0,0,r,0,6.28);
 const g=c.createRadialGradient(-r*0.35,-r*0.4,r*0.1,0,0,r);g.addColorStop(0,"#fff");g.addColorStop(0.18,m);g.addColorStop(1,d);c.fillStyle=g;c.fill();
 if(t===10){c.strokeStyle="rgba(30,120,50,.55)";c.lineWidth=Math.max(2,r*0.12);c.beginPath();c.quadraticCurveTo(-r*.4,-r*.4,0,0);c.stroke();c.beginPath();c.moveTo(-r*.55,r*.1);c.quadraticCurveTo(0,r*.2,r*.55,r*.1);c.stroke();c.beginPath();c.moveTo(-r*.4,r*.45);c.quadraticCurveTo(0,r*.3,r*.4,r*.45);c.stroke();}
 if(t===1){c.fillStyle=m;for(let i=0;i<7;i++){const a=i*0.9,dx=Math.cos(a)*r*0.45,dy=Math.sin(a)*r*0.45;c.beginPath();c.arc(dx,dy,r*0.28,0,6.28);c.fill();}}
 if(t===3){c.strokeStyle="rgba(200,100,90,.4)";c.lineWidth=Math.max(1,r*0.06);c.beginPath();c.moveTo(0,-r*.7);c.quadraticCurveTo(-r*.12,0,0,r*.75);c.stroke();}
 if(t===6){c.fillStyle="rgba(200,80,0,.25)";for(let i=0;i<8;i++){c.beginPath();c.arc((i%4-1.5)*r*.3,(i>3?1:-1)*r*.25,Math.max(1,r*.04),0,6.28);c.fill();}}
 if(t===0||t===4||t===5){c.strokeStyle="#6a3a18";c.lineWidth=Math.max(2,r*0.1);c.beginPath();c.moveTo(0,-r*.85);c.lineTo(0,-r*1.15);c.stroke();c.fillStyle="#34c759";c.beginPath();c.ellipse(r*.28,-r*1.05,r*.32,r*.16,0.5,0,6.28);c.fill();}
 jt_shine(c,r);
}

function rrect(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

function heartPath(c,x,y,s){c.beginPath();c.moveTo(x,y+s*0.9);c.bezierCurveTo(x-s*1.3,y-s*0.1,x-s*0.6,y-s*1.1,x,y-s*0.35);c.bezierCurveTo(x+s*0.6,y-s*1.1,x+s*1.3,y-s*0.1,x,y+s*0.9);c.closePath();}
function eggPath(c,x,y,rx,ry){c.beginPath();c.moveTo(x,y-ry*1.04);c.bezierCurveTo(x+rx*0.66,y-ry*1.04,x+rx,y-ry*0.36,x+rx,y+ry*0.2);c.bezierCurveTo(x+rx,y+ry*0.7,x+rx*0.58,y+ry*0.99,x,y+ry*0.99);c.bezierCurveTo(x-rx*0.58,y+ry*0.99,x-rx,y+ry*0.7,x-rx,y+ry*0.2);c.bezierCurveTo(x-rx,y-ry*0.36,x-rx*0.66,y-ry*1.04,x,y-ry*1.04);c.closePath();}
function twinklePath(c,x,y,s){c.beginPath();c.moveTo(x,y-s);c.quadraticCurveTo(x,y,x+s,y);c.quadraticCurveTo(x,y,x,y+s);c.quadraticCurveTo(x,y,x-s,y);c.quadraticCurveTo(x,y,x,y-s);c.closePath();}
function radial(c,x,y,r0,r1,stops){var g=c.createRadialGradient(x,y,Math.max(0,r0),x,y,Math.max(0.01,r1));for(var i=0;i<stops.length;i+=2)g.addColorStop(stops[i],stops[i+1]);return g;}

 }

<script>
/* ===== Fruit Pop Jar 2 — FX (FPJ.fx): pooled juicy particles, shake, flash, slow-mo, floating text, juice shots ===== */
(function(){

function mkText(){return {x:0,y:0,text:"",c:"#fff",dark:"#333",light:"#fff",deep:"#fff",size:40,font:"",t:0,life:1.4,seed:0,grad:null,gctx:null,w:-1};}

/* ---------- colour helpers (cached) ---------- */
var colCache=new Map();

/* ---------- state: shake / flash / slowmo ---------- */

function W(){return num(FPJ.W,window.innerWidth||1024);}

/* ---------- spawners ---------- */
function drop(x,y,vx,vy,r,c,life){

}
function splat(x,y,r,c,life){

function splash(x,y,color,power){

function sparkle(x,y,color,n){

function ring(x,y,color,radius){
  x=num(x,NaN);y=num(y,NaN);if(!isFinite(x)||!isFinite(y))return;
  ringP(x,y,color||"#ffffff",clamp(num(radius,60),4,2000),.5,false);

  n=clamp(Math.round(num(n,60)*quality),1,300);

  var rain=y<0, w=W();

    p.c=CONF_COLS[(rnd()*CONF_COLS.length)|0];

    else{var a=-Math.PI/2+(rnd()-.5)*Math.PI*1.1,s=260+rnd()*420;p.x=x;p.y=y;p.vx=cos(a)*s;p.vy=sin(a)*s;}

/* ---------- world update (may be slowed) ---------- */

  for(i=splats.n-1;i>=0;i--){p=splats.a[i];p.life+=dt;if(p.life>=p.max)kill(splats,i);}
  for(i=rings.n-1;i>=0;i--){p=rings.a[i];p.life+=dt;if(p.life>=p.max)kill(rings,i);}
  dr=Math.pow(.2,dt);
  for(i=sparks.n-1;i>=0;i--){p=sparks.a[i];p.life+=dt;if(p.life>=p.max){kill(sparks,i);continue;}
    p.vx*=dr;p.vy=p.vy*dr+120*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=p.va*dt;}
  for(i=trail.n-1;i>=0;i--){p=trail.a[i];p.life+=dt;if(p.life>=p.max){kill(trail,i);continue;}
    p.vy+=260*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}

    var u=min(1,p.t/p.dur), e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2; e=e*.35+u*.65;

    p.x=o*o*p.x1+2*o*e*p.cx+e*e*p.x2;p.y=o*o*p.y1+2*o*e*p.cy+e*e*p.y2;

    p.acc+=dt;

      q.x=p.x+(rnd()-.5)*p.r*.8;q.y=p.y+(rnd()-.5)*p.r*.8;q.vx=(rnd()-.5)*30;q.vy=(rnd()-.5)*30;
      q.r=p.r*(.35+rnd()*.3);q.c=rnd()<.3?p.sh.light:p.c;q.life=0;q.max=.22+rnd()*.15;}
    if(u>=1){var cb=p.cb;p.cb=null;var hx=p.x2,hy=p.y2,col=p.c;kill(shots,i);
      splash(hx,hy,col,1.6);sparkle(hx,hy,"#fff6a8",6);
      if(cb)try{cb();}catch(err){if(window.console)console.warn("juiceShot onHit",err);}

}
function update(dt){
  dt=num(dt,0);if(dt<=0)return;if(dt>.05)dt=.05;

/* ---------- world draw ---------- */

var problems=[];

function parseMel(str,key,name){
  var tk=str.split(/\s+/).filter(function(x){return x&&x!=="|";}), out=new Array(64), last=null;
  for(var j=0;j<64;j++)out[j]=null;
  if(tk.length!==32)problems.push(name+": melody has "+tk.length+" tokens");
  for(var i=0;i<32;i++){var s=tk[i]||".";
    if(s==="-"){if(last)last.d+=2;continue;}
    if(s==="."){last=null;continue;}
    var m=/^([#b]?)([1-7])([',]*)$/.exec(s);
    if(!m){problems.push(name+": bad token "+s);last=null;continue;}
    var semi=SC[+m[2]-1]+(m[1]==="#"?1:m[1]==="b"?-1:0);
    for(var k=0;k<m[3].length;k++)semi+=m[3][k]==="'"?12:-12;
    last={m:key+semi,d:2};out[i*2]=last;}
  return out;
}
function parseChord(tok,key,name){

  if(!m){problems.push(name+": bad chord "+tok);m=[tok,"","1",""];}
  var root=SC[+m[2]-1]+(m[1]==="#"?1:m[1]==="b"?-1:0), q=m[3]||"";
  var iv=q==="m"?[0,3,7]:q==="7"?[0,4,7,10]:q==="m7"?[0,3,7,10]:q==="M7"?[0,4,7,11]:[0,4,7];
  var cn=[],i,n;
  for(i=0;i<iv.length;i++){n=key+root+iv[i];while(n<key-5)n+=12;while(n>key+8)n-=12;cn.push(n);}
  cn.sort(function(a,b){return a-b;});
  var b=key+root-24;while(b<40)b+=12;while(b>51)b-=12;
  return {cn:cn,arp:[cn[0],cn[1],cn[2],cn[0]+12,cn[2],cn[1]],b:b,third:iv[1]};

function parseChords(str,key,name){
  var bars=str.split(/\s+/).filter(Boolean), out=[];

    var a=parseChord(hs[0],key,name), b=hs[1]?parseChord(hs[1],key,name):a;out.push(a,b);}

function tick(){
  if(!AC){stopTimer();return;}

    if(p.stopAt&&now>=p.stopAt){killPlayer(p);players.splice(i,1);continue;}
