<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<meta name="application-name" content="Emmy's Empire">
<meta name="format-detection" content="telephone=no">

<link rel="manifest" href="manifest.webmanifest">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe8ff;touch-action:none;overscroll-behavior:none;font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito",system-ui,sans-serif}
#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
svg{display:block}
/* ---------- home ---------- */
#scene{position:absolute;inset:0;width:100%;height:100%}
#bubbles{position:absolute;left:50%;top:19vh;transform:translateX(-50%);width:calc(4*var(--b) + 6vw);height:calc(2*var(--b) + 3.2vh);--b:min(17vw,29vh);overflow:hidden}
#bubbleTrack{display:flex;width:100%;height:100%;transition:transform .35s ease}
.bpage{flex:0 0 100%;display:grid;grid-template-columns:repeat(4,var(--b));gap:3.2vh 2vw;justify-content:center;align-content:start}
.homeArrow{position:absolute;top:36vh;width:min(12vh,8.5vw);height:min(12vh,8.5vw);border-radius:50%;background:#fff;box-shadow:0 .7vh 0 rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;z-index:7;cursor:pointer}
.homeArrow svg{width:70%;height:70%;pointer-events:none}
#homePrev{left:max(.4vw,env(safe-area-inset-left))}
#homeNext{right:max(.4vw,env(safe-area-inset-right))}
#homeDots{position:absolute;left:50%;bottom:calc(max(2vh,env(safe-area-inset-bottom)) + min(16vh,12vw) + .4vh);transform:translateX(-50%);display:flex;gap:1.2vh;z-index:7}
#homeDots i{width:2vh;height:2vh;border-radius:50%;background:#fff;opacity:.55;cursor:pointer;box-shadow:0 .3vh 0 rgba(0,0,0,.12)}
#homeDots i.on{opacity:1;background:#ffd23f;transform:scale(1.25)}
.bubble{position:relative;width:var(--b);height:var(--b);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,var(--c) 38%,var(--c2) 100%);box-shadow:0 1vh 0 rgba(0,0,0,.12),inset 0 -1vh 2vh rgba(0,0,0,.08);border:.6vh solid #fff;cursor:pointer;transition:transform .2s,box-shadow .2s}
.bubble svg{position:absolute;inset:12%;width:76%;height:76%;pointer-events:none}
.bubble.locked svg{filter:saturate(.55) brightness(1.06);opacity:.85}
.bubble.live{animation:breathe 2.2s ease-in-out infinite;box-shadow:0 1vh 0 rgba(0,0,0,.12),0 0 3vh 1vh rgba(255,236,140,.9)}
@keyframes breathe{50%{transform:scale(1.05)}}
.bubble.locked{animation:idlewig 5s ease-in-out infinite;animation-delay:var(--d)}
@keyframes idlewig{0%,82%,100%{transform:rotate(0)}85%{transform:rotate(-6deg)}88%{transform:rotate(6deg)}91%{transform:rotate(-4deg)}94%{transform:rotate(3deg)}}
.bubble.wobble{animation:wobble .65s ease!important}
@keyframes wobble{0%{transform:scale(1)}20%{transform:scale(1.14) rotate(-9deg)}40%{transform:scale(1.1) rotate(8deg)}60%{transform:scale(1.12) rotate(-5deg)}80%{transform:scale(1.08) rotate(3deg)}100%{transform:scale(1.08)}}
.bubble.sel{transform:scale(1.08);box-shadow:0 0 0 .8vh #fff,0 0 4vh 1.6vh #fff59a}
.bubble.sel.live::after{content:"";position:absolute;inset:-1.6vh;border-radius:50%;border:.7vh dashed #fff;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.soon{position:absolute;right:-4%;top:-6%;background:#fff;color:#ff5d8f;font-weight:800;font-size:calc(var(--b)*.13);padding:.3em .55em;border-radius:1em;box-shadow:0 .4vh 0 rgba(0,0,0,.12);transform:rotate(8deg);pointer-events:none;display:flex;align-items:center;gap:.25em}
.soon svg{position:static;width:.9em;height:.9em}
.bubble.wobble .soon{animation:soonpop .65s ease}
@keyframes soonpop{0%{transform:rotate(8deg) scale(1)}40%{transform:rotate(-4deg) scale(1.5)}100%{transform:rotate(8deg) scale(1.15)}}
.focus{outline:none;box-shadow:0 0 0 1vh #fff,0 0 5vh 2.4vh #ffe45c!important}
svg.focus{box-shadow:none!important;filter:drop-shadow(0 0 1vh #fff) drop-shadow(0 0 2.5vh #ffe45c)}
#emmy{position:absolute;left:.8vw;bottom:0;width:min(12.5vw,25vh);pointer-events:none}
#emmy .arm{transform-box:view-box;transform-origin:138px 188px;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(18deg)}}
#everett{position:absolute;right:.6vw;bottom:.5vh;width:min(13vw,27vh);cursor:pointer;border-radius:3vh}
#everett.bounce{animation:bounce .5s ease}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-3vh) rotate(-3deg)}60%{transform:translateY(0) rotate(2deg)}80%{transform:translateY(-1vh)}}
#everett .m2,#everett .m3{display:none}
#everett.giggle .m1,#everett.rasp .m1{display:none}
#everett.giggle .m2{display:inline}#everett.rasp .m3{display:inline}
/* ---------- hud ---------- */
#hud{position:absolute;top:max(1.5vh,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:1.6vw;z-index:20;pointer-events:none}
.pill{display:flex;align-items:center;gap:.8vh;background:rgba(255,255,255,.88);border-radius:6vh;padding:.6vh 2.2vh .6vh .8vh;font-weight:900;font-size:6vh;color:#5b4a8b;box-shadow:0 .6vh 0 rgba(0,0,0,.1);height:12vh}
.pill svg{height:10.5vh;width:10.5vh}
#jarPill{pointer-events:auto;cursor:pointer}
.bump{animation:bumpk .45s ease}
@keyframes bumpk{40%{transform:scale(1.25)}}
#gear{position:absolute;top:max(1.5vh,env(safe-area-inset-top));right:max(1.5vh,env(safe-area-inset-right));width:9vh;height:9vh;border-radius:50%;background:conic-gradient(#ff7aa8 calc(var(--p,0)*1turn),rgba(255,255,255,.6) 0);display:flex;align-items:center;justify-content:center;z-index:25;cursor:pointer}
#gear svg{width:70%;height:70%}
/* ---------- paint ---------- */
#paint{background:#fff}
#paper{position:absolute;inset:0;width:100%;height:100%;touch-action:none;background:#fff;cursor:crosshair}
.ui{position:absolute;z-index:10}
#rail{left:max(1.2vh,env(safe-area-inset-left));top:max(1.2vh,env(safe-area-inset-top));display:flex;flex-direction:column;gap:1.6vh}
.tbtn{--s:min(14vh,11vw);width:var(--s);height:var(--s);border-radius:50%;background:#fff;border:.6vh solid #e8e2ff;box-shadow:0 .7vh 0 rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:transform .15s}
.tbtn svg{width:72%;height:72%;pointer-events:none}
.tbtn.on{border-color:#ffcf3f;box-shadow:0 0 0 .7vh #fff3b0,0 .7vh 0 rgba(0,0,0,.12);transform:scale(1.08)}
.castleBtn{background:conic-gradient(#7ad37a calc(var(--p,0)*1turn),#fff 0);border-color:#d6f5d6}
#palette{left:50%;transform:translateX(-50%);bottom:max(1.2vh,env(safe-area-inset-bottom));display:flex;gap:calc(var(--ps)*.12);--ps:min(18vh,calc((100vw - min(14vh,11vw) - 6vw)/9));padding-left:calc(min(14vh,11vw)*.6)}
.pot{width:var(--ps);height:var(--ps);border-radius:50%;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.75) 0,rgba(255,255,255,0) 30%),var(--c);border:.6vh solid #fff;box-shadow:0 .7vh 0 rgba(0,0,0,.18);cursor:pointer;transition:transform .15s}
.pot.on{transform:translateY(-2.2vh) scale(1.12);box-shadow:0 0 0 .8vh var(--c),0 1vh 0 rgba(0,0,0,.18)}
#newBtn{position:absolute;right:max(1.2vh,env(safe-area-inset-right));top:max(1.2vh,env(safe-area-inset-top));--s:min(17vh,13vw);background:#fff6d8;border-color:#ffd56b}
#sunny{right:max(1vh,env(safe-area-inset-right));top:calc(min(17vh,13vw) + 4vh);width:min(16vh,12vw);cursor:pointer}
#sunny.talk{animation:bounce .5s ease}
.cursor{position:absolute;z-index:30;width:9vh;height:9vh;margin:-4.5vh 0 0 -4.5vh;border-radius:50%;border:1vh solid var(--c,#333);box-shadow:0 0 0 .5vh #fff,0 0 3vh #fff;pointer-events:none;display:none}
.cursor.show{display:block}
.cursor::after{content:"";position:absolute;inset:30%;border-radius:50%;background:var(--c,#333)}
#wipe{position:absolute;top:0;bottom:0;left:0;width:140vw;z-index:15;pointer-events:none;transform:translateX(-140vw);display:none}
#wipe.go{display:block;animation:wipe 1s linear forwards}
@keyframes wipe{to{transform:translateX(100vw)}}
/* ---------- v0.2 shared ---------- */
.cornerCastle{position:absolute;left:max(1.2vh,env(safe-area-inset-left));top:max(1.2vh,env(safe-area-inset-top))}
.hop{animation:bounce .5s ease}
/* ---------- animal barn ---------- */
#barn{background:#9fdcff}
#barnScene{position:absolute;inset:0}
#doors{position:absolute;left:50%;bottom:5vh;transform:translateX(-50%);display:flex;gap:2.5vw;z-index:5}
.door{position:relative;width:min(22vw,38vh);height:min(31vw,56vh);perspective:150vh;cursor:pointer;border-radius:3vh 3vh 1vh 1vh}
.door .frame{position:absolute;inset:0;background:radial-gradient(circle at 50% 80%,#fff6d8 0,#f2d68f 70%);border-radius:3vh 3vh 1vh 1vh;box-shadow:0 0 0 1vh #fff,0 1.2vh 0 1vh rgba(0,0,0,.12)}
.door .ani{position:absolute;left:1%;width:98%;bottom:2%;height:auto;aspect-ratio:1;transform:scale(0);transform-origin:50% 100%;transition:transform .4s cubic-bezier(.3,1.6,.5,1) .12s}
.door.open .ani{transform:scale(1)}
.door .ani.hop{animation:anihop .55s ease}
@keyframes anihop{30%{transform:scale(1.12) translateY(-4%)}}
.door .leaf{position:absolute;top:0;bottom:0;width:50%;transition:transform .5s ease;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.door .leaf svg{width:100%;height:100%}
.door .leaf.l{left:0;transform-origin:0 50%;border-radius:3vh 0 0 1vh;overflow:hidden}
.door .leaf.r{right:0;transform-origin:100% 50%;border-radius:0 3vh 1vh 0;overflow:hidden}
.door .leaf.r svg{transform:scaleX(-1)}
.door.open .leaf.l{transform:rotateY(-108deg)}
.door.open .leaf.r{transform:rotateY(108deg)}
#daddy{position:absolute;left:.8vw;bottom:0;width:min(12.5vw,25vh);cursor:pointer;z-index:6;border-radius:3vh}
#daddy svg{width:100%;height:auto}
#daddy .arm{transform-box:view-box;transform-origin:138px 182px;animation:wave 1.8s ease-in-out infinite}
/* ---------- color hunt ---------- */
#hunt{background:#bfe8ff}
#items{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);display:flex;gap:5vw;align-items:center}
#items[data-n="3"]{gap:3vw}
.item{--is:min(25vw,50vh);width:var(--is);height:calc(var(--is)*1.15);cursor:pointer;border-radius:4vh;transition:transform .2s}
#items[data-n="3"] .item{--is:min(23vw,48vh)}
.item svg{width:100%;height:100%;pointer-events:none}
.item.nope{animation:nope .5s ease}
@keyframes nope{20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(2deg)}}
.item.hint{animation:hint 1.3s ease-in-out infinite}
@keyframes hint{50%{transform:scale(1.08);filter:drop-shadow(0 0 3vh #fff) drop-shadow(0 0 1.5vh #ffe45c)}}
.item.yay{animation:yay .9s ease forwards}
@keyframes yay{30%{transform:scale(1.25) rotate(-6deg)}60%{transform:scale(1.15) rotate(5deg)}100%{transform:scale(1.2) translateY(-6vh)}}
#huntSunny{position:absolute;right:max(1vh,env(safe-area-inset-right));top:max(1vh,env(safe-area-inset-top));width:min(17vh,13vw);cursor:pointer;z-index:10;border-radius:3vh}
#huntSunny svg{width:100%;height:auto}
/* ---------- book tabs ---------- */
.tab{width:12vh;height:12vh;border-radius:50%;background:#fff;border:.6vh solid #e8e2ff;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.55;transition:transform .15s}
.tab.on{opacity:1;border-color:#ffcf3f;transform:scale(1.12)}
.bookHead .tab svg{width:78%;height:78%}
/* ---------- v0.3 ---------- */
.evm2,.evm3{display:none}
.giggle .evm1,.rasp .evm1{display:none}
.giggle .evm2,.rasp .evm3{display:inline}
.cameo{position:absolute;width:min(11vw,21vh);cursor:pointer;z-index:9;border-radius:3vh}
.cameo svg{width:100%;height:auto}
#paint .cameo{right:max(1vh,env(safe-area-inset-right));top:calc(min(17vh,13vw) + min(16vh,12vw) + 7vh);width:min(16vh,10vw)}
#barn .cameo{right:1vw;bottom:1vh}
#hunt .cameo{left:1vw;bottom:1vh}
#peek{background:#ffe9d6}
#peekScene,#seaScene{position:absolute;inset:0}
#spots{position:absolute;left:50%;bottom:7vh;transform:translateX(-50%);display:flex;gap:3vw;align-items:flex-end;z-index:5}
#spots[data-n="3"]{gap:2.2vw}
.spot{position:relative;width:min(25vw,46vh);height:min(25vw,46vh);cursor:pointer;border-radius:3vh}
#spots[data-n="3"] .spot{width:min(23vw,42vh);height:min(23vw,42vh)}
.spot .ev{position:absolute;left:14%;width:72%;bottom:6%;height:auto;transform:translateY(22%);transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.spot .toy{position:absolute;left:28%;width:44%;bottom:6%;transform:translateY(10%)}
.spot .toy svg{width:100%;height:auto}
.spot .cover{position:absolute;left:0;right:0;bottom:0;height:80%;transition:transform .45s ease;transform-origin:50% 100%;filter:drop-shadow(0 1vh 0 rgba(0,0,0,.1))}
.spot .cover svg{width:100%;height:100%}
.spot.found .cover{transform:translateY(22%) scaleY(.38)}
.spot.found .ev{transform:translateY(-22%) scale(1.08)}
.spot.peekhint .ev{transform:translateY(-4%)}
.spot.peekhint .cover{animation:nope .6s ease}
.spot.lift .cover{transform:translateY(-38%) rotate(-5deg)}
#katie{position:absolute;left:.8vw;bottom:0;width:min(12vw,24vh);cursor:pointer;z-index:6;border-radius:3vh}
#katie svg{width:100%;height:auto}
#katie .arm{transform-box:view-box;transform-origin:138px 184px;animation:wave 1.7s ease-in-out infinite}
#bubble{background:#2d9fd8}
#bubbleArea{position:absolute;inset:0;overflow:hidden;z-index:4}
.bub{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0,rgba(255,255,255,.4) 10%,rgba(255,255,255,.06) 42%,rgba(190,240,255,.22) 70%,rgba(255,255,255,.7) 100%);box-shadow:inset 0 0 2.5vh rgba(255,255,255,.75),0 0 1.5vh rgba(255,255,255,.35);cursor:pointer;will-change:transform}
.bub svg{position:absolute;inset:15%;width:70%;height:70%;pointer-events:none}
.reveal{position:absolute;pointer-events:none;z-index:7;animation:reveal 1.8s ease forwards}
.reveal svg{width:100%;height:100%}
@keyframes reveal{0%{transform:scale(.6)}20%{transform:scale(1.15)}35%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-8vh)}}
#fishy{position:absolute;left:1vw;bottom:3vh;width:min(17vw,30vh);cursor:pointer;z-index:8;animation:bob 3s ease-in-out infinite;border-radius:3vh}
#fishy svg{width:100%;height:auto}
@keyframes bob{50%{transform:translateY(-2vh)}}
/* ---------- v0.4 sticker zoo ---------- */
#zooScene{position:absolute;inset:0}
#zooLayer{position:absolute;inset:0;z-index:4}
.placed{position:absolute;transform:translate(-50%,-50%);cursor:grab;filter:drop-shadow(0 .6vh .4vh rgba(0,0,0,.18))}
.placed svg{width:100%;height:100%;pointer-events:none}
.placed.dragging{z-index:50;transform:translate(-50%,-50%) scale(1.18);transition:none}
.placed.hop{animation:phop .45s ease}
@keyframes phop{40%{transform:translate(-50%,-50%) scale(1.25)}}
#tray{position:absolute;left:50%;transform:translateX(-50%);bottom:max(1vh,env(safe-area-inset-bottom));width:min(96vw,1400px);height:calc(min(14vh,9.5vw) + 3vh);background:rgba(255,255,255,.82);border-radius:4vh;display:flex;align-items:center;justify-content:space-between;padding:0 1vw;z-index:8;box-shadow:0 .8vh 0 rgba(0,0,0,.12)}
#trayItems{display:flex;gap:calc(min(14vh,9.5vw)*.18);align-items:center;justify-content:center;flex:1}
.titem{width:min(14vh,9.5vw);height:min(14vh,9.5vw);cursor:grab}
.titem svg{width:100%;height:100%;pointer-events:none}
.tarrow{width:min(12vh,8vw);height:min(12vh,8vw);border-radius:50%;background:#e8e2ff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tarrow svg{width:70%;height:70%;pointer-events:none}
#sceneBtns{position:absolute;right:max(1.2vh,env(safe-area-inset-right));top:calc(max(1.2vh,env(safe-area-inset-top)) + 11vh);display:flex;flex-direction:column;gap:1.6vh;z-index:9}
.sceneBtn{--s:min(13vh,9vw);padding:0;overflow:hidden}
.sceneBtn svg{width:100%!important;height:100%!important}
.sceneBtn.on{border-color:#ffcf3f;box-shadow:0 0 0 .7vh #fff3b0,0 .7vh 0 rgba(0,0,0,.12);transform:scale(1.08)}
#zooClear{position:absolute;top:max(1.2vh,env(safe-area-inset-top));right:max(1.2vh,env(safe-area-inset-right));width:9vh;height:9vh;border-radius:50%;background:conic-gradient(#ff7aa8 calc(var(--p,0)*1turn),rgba(255,255,255,.75) 0);display:flex;align-items:center;justify-content:center;z-index:9;cursor:pointer}
#zooClear svg{width:70%;height:70%;pointer-events:none}
/* ---------- v0.4 shake & dance ---------- */
#danceScene{position:absolute;inset:0}
#lights{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;z-index:2}
#lights.on{opacity:1}
#lights i{position:absolute;width:40vw;height:40vw;border-radius:50%;filter:blur(5vh);opacity:.3;animation:lightc 1s ease-in-out infinite alternate}
@keyframes lightc{from{transform:translate(-5vw,0) scale(.9)}to{transform:translate(5vw,4vh) scale(1.1)}}
#dancers{position:absolute;left:50%;top:24vh;transform:translateX(-50%);display:flex;gap:1.5vw;align-items:flex-end;z-index:4;height:46vh}
.dancer{width:min(15vw,24vh);height:100%;display:flex;align-items:flex-end;justify-content:center}
.dancer svg{width:100%;height:auto;max-height:100%;transform-origin:50% 100%;animation:idle 2.4s ease-in-out infinite}
.dancer:nth-child(2n) svg{animation-delay:-1.2s}
.dancer .arm{transform-box:view-box;transform-origin:138px 188px;animation:wave 1s ease-in-out infinite}
@keyframes idle{50%{transform:rotate(2deg) translateY(-.6vh)}}
.d-wiggle .dancer svg{animation:dwig .4s ease-in-out infinite}@keyframes dwig{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
.d-jump .dancer svg{animation:djump .5s ease-in-out infinite}@keyframes djump{50%{transform:translateY(-9vh) scale(1.05,.95)}}
.d-spin .dancer svg{animation:dspin .9s linear infinite;transform-origin:50% 60%}@keyframes dspin{to{transform:rotate(360deg)}}
.d-sway .dancer svg{animation:dsway 1s ease-in-out infinite}@keyframes dsway{0%,100%{transform:translateX(-2.5vw) rotate(-7deg)}50%{transform:translateX(2.5vw) rotate(7deg)}}
.d-clap .dancer svg{animation:dclap .35s ease-in-out infinite}@keyframes dclap{50%{transform:scale(1.12,.88)}}
.d-twist .dancer svg{animation:dtwist .5s ease-in-out infinite}@keyframes dtwist{0%,100%{transform:skewX(-14deg)}50%{transform:skewX(14deg)}}
.d-bounce .dancer svg{animation:dbounce .4s cubic-bezier(.3,1.6,.5,1) infinite}@keyframes dbounce{50%{transform:translateY(-5vh) scaleY(1.08)}}
.d-wave .dancer svg{animation:dwave .8s ease-in-out infinite}.d-wave .dancer:nth-child(2) svg{animation-delay:-.16s}.d-wave .dancer:nth-child(3) svg{animation-delay:-.32s}.d-wave .dancer:nth-child(4) svg{animation-delay:-.48s}.d-wave .dancer:nth-child(5) svg{animation-delay:-.64s}@keyframes dwave{0%,100%{transform:translateY(0)}50%{transform:translateY(-6vh) rotate(6deg)}}
#playBtn{position:absolute;left:50%;bottom:max(2vh,env(safe-area-inset-bottom));width:min(28vh,20vw);height:min(28vh,20vw);margin-left:calc(min(28vh,20vw)/-2);border-radius:50%;cursor:pointer;z-index:6;filter:drop-shadow(0 1vh 0 rgba(0,0,0,.25))}

(function paginateHome(){
 const wrap=$("bubbles");if(!wrap||!bubbles.length)return;

 const pages=Math.ceil(bubbles.length/PAGE_SZ);
 for(let i=0;i<pages;i++){const pg=document.createElement("div");pg.className="bpage";pg.dataset.page=i;track.appendChild(pg);}
 bubbles.forEach((b,i)=>track.children[Math.floor(i/PAGE_SZ)].appendChild(b));

 const prev=$("homePrev"),next=$("homeNext"),dots=$("homeDots");
 if(prev){prev.innerHTML=ARROW(-1);prev.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();setHomePage(homePage-1,true);});prev._act=()=>setHomePage(homePage-1,true);}
 if(next){next.innerHTML=ARROW(1);next.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();setHomePage(homePage+1,true);});next._act=()=>setHomePage(homePage+1,true);}

 wrap.addEventListener("pointerdown",e=>{if(e.target.closest&&e.target.closest(".bubble"))return;sx=e.clientX;sy=e.clientY;sw=true;});
 window.addEventListener("pointerup",e=>{if(!sw)return;sw=false;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.2)setHomePage(homePage+(dx<0?1:-1),true);});
 setHomePage(0,false);
})();
function setHomePage(n,speak){const pages=Math.ceil(GAMES.length/PAGE_SZ);if(n<0||n>=pages)return;const ch=homePage!==n;homePage=n;
 const tr=$("bubbleTrack");if(tr)tr.style.transform="translateX("+(-100*n)+"%)";

["pointerup","pointercancel"].forEach(ev=>window.addEventListener(ev,e=>{if(gdrags.has("p"+e.pointerId))gEnd("p"+e.pointerId,e.clientX,e.clientY,ev==="pointercancel");}));

 if(m<.18){x=0;y=0;}else{const s=(m-.18)/(1-.18)/m;x*=s;y*=s;}if(btn(p,14))x=-1;if(btn(p,15))x=1;if(btn(p,12))y=-1;if(btn(p,13))y=1;

 const sp=Math.min(innerWidth,innerHeight)*1.1;c.x=Math.max(0,Math.min(innerWidth,c.x+x*sp*dt));c.y=Math.max(0,Math.min(innerHeight,c.y+y*sp*dt));el.style.left=c.x+"px";el.style.top=c.y+"px";
 const key="g"+k;if(gdrags.has(key))gMove(key,c.x,c.y);
 if(edge(0)){if(gdrags.has(key))gEnd(key,c.x,c.y,false);else{el.style.display="none";const u=document.elementFromPoint(c.x,c.y);el.style.display="";const t=u&&u.closest?u.closest(".gitem,.padable"):null;
  if(t&&t._grab)t._grab(key,c.x,c.y);else if(t&&t._act)t._act();}}

SFX.juicy=function(n){const f=280+n*48;tone(f,0,.1,"sine",.24,f*1.45);tone(f*1.45,.08,.2,"triangle",.2,f*2.15);tone(f*2.1,.16,.16,"sine",.12,f*2.6);noise(0,.1,2200,700,.18,1.4);};

GAME_IDS.push("fruit");
SETS.fruit={n:11,label:k=>FRUIT[k][0],svg:(k,e)=>fruitSticker(k,e),dot:k=>FRUIT[k][1],voice:"poppy"};
const FJ={items:[],held:null,next:0,dropX:.5,score:0,combo:1,comboT:0,grown:false,over:false,pouring:false,pourT:0,warnT:0,cool:0,running:false,raf:0,W:400,H:560,left:0,right:0,bot:0,top:0,line:0,dropY:0,scale:1,uid:1,lastT:0,pop:[],busy:false};
function fruitRad(type){const base=FJ.grown?1:1.22;return Math.max(10,FRUIT[type][3]*FJ.W*base);}
function fruitSize(){const cv=$("fruitCV");if(!cv)return;const r=cv.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);
 cv.width=Math.max(2,Math.round(r.width*dpr));cv.height=Math.max(2,Math.round(r.height*dpr));
 FJ.W=r.width;FJ.H=r.height;FJ.left=FJ.W*0.08;FJ.right=FJ.W*0.92;FJ.bot=FJ.H*0.92;FJ.top=FJ.H*0.06;FJ.line=FJ.H*0.18;FJ.dropY=FJ.H*0.10;FJ.scale=FJ.W/420;
 const nx=$("fruitNext");if(nx){const nr=nx.getBoundingClientRect();let nw=nr.width,nh=nr.height;if(nw<8||nh<8){const cs=getComputedStyle(nx);nw=parseFloat(cs.width)||0;nh=parseFloat(cs.height)||0;}if(nw<8||nh<8){nw=Math.max(48,FJ.H*0.1);nh=nw;}nx.width=Math.max(2,Math.round(nw*dpr));nx.height=Math.max(2,Math.round(nh*dpr));fruitDrawNext();}
}
function fruitAdd(type,x,y,vx,vy){const f={id:FJ.uid++,type:type,x:x,y:y,vx:vx||0,vy:vy||0,r:fruitRad(type),merge:0,mx:0,my:0,pop:1,squash:0,dead:false};FJ.items.push(f);return f;}
function fruitPickDrop(){const max=FJ.grown?4:3;return Math.random()*max|0;}
function fruitNewHeld(){FJ.held={type:FJ.next,x:FJ.left+(FJ.right-FJ.left)*FJ.dropX};FJ.next=fruitPickDrop();}
function fruitResetRound(keepScore){FJ.items.length=0;FJ.pop.length=0;FJ.over=false;FJ.pouring=false;FJ.pourT=0;FJ.warnT=0;FJ.cool=0;FJ.combo=1;FJ.comboT=0;FJ.busy=false;if(!keepScore)FJ.score=0;FJ.next=fruitPickDrop();FJ.dropX=.5;fruitNewHeld();$("fruitOver").classList.remove("on");fruitHud();fruitDraw();}
function fruitSetMode(grown,speak){FJ.grown=!!grown;S.fruitGrown=FJ.grown;save();fruitApplyUI();fruitResetRound(false);
 if(speak){SFX.chime();say(FJ.grown?"Grown-up mode! Don't let the fruit go over the line!":"Toddler mode! Keep popping fruit!","poppy");}
}

}

function fruitLeave(){FJ.running=false;cancelAnimationFrame(FJ.raf);FJ.raf=0;FJ.items.length=0;FJ.held=null;$("fruitOver").classList.remove("on");}
function fruitLoop(t){if(!FJ.running||screen!=="fruit")return;const dt=Math.min(.033,(t-FJ.lastT)/1000)||.016;FJ.lastT=t;fruitStep(dt);FJ.raf=requestAnimationFrame(fruitLoop);}
function fruitStep(dt){
 if(FJ.over){fruitDraw();return;}
 if(FJ.cool>0)FJ.cool-=dt;
 if(FJ.pouring){fruitStepPour(dt);fruitDraw();return;}
 const sub=dt>0.02?3:2,h=dt/sub,g=1600*FJ.scale;
 for(let s=0;s<sub;s++){
  for(const f of FJ.items){if(f.dead||f.merge>0||f.pin)continue;f.vy+=g*h;f.vx*=(1-1.15*h);f.vy*=(1-0.08*h);f.x+=f.vx*h;f.y+=f.vy*h;}
  fruitWalls();
  for(let k=0;k<6;k++)fruitPairs();
  fruitMerges();
  fruitTickMerge(h);
 }
 for(const f of FJ.items){if(f.pop<1){f.pop=Math.min(1,f.pop+dt*6);}if(f.squash>0)f.squash=Math.max(0,f.squash-dt*5);}
 FJ.items=FJ.items.filter(f=>!f.dead);
 fruitTickPop(dt);
 if(FJ.grown)fruitTickDanger(dt);else fruitTickFill(dt);
 fruitHud();fruitDraw();
}
function fruitWalls(){for(const f of FJ.items){if(f.dead||f.merge>0||f.pin)continue;
  if(f.x-f.r<FJ.left){f.x=FJ.left+f.r;f.vx=Math.abs(f.vx)*0.15;}
  if(f.x+f.r>FJ.right){f.x=FJ.right-f.r;f.vx=-Math.abs(f.vx)*0.15;}
  if(f.y+f.r>FJ.bot){f.y=FJ.bot-f.r;if(f.vy>0){f.squash=Math.min(.25,f.vy/800);f.vy=-f.vy*0.18;}if(Math.abs(f.vy)<18)f.vy=0;f.vx*=0.72;}
  if(f.y-f.r<FJ.top){/* open top */ if(f.y<f.r*0.2){f.y=f.r*0.2;if(f.vy<0)f.vy=0;}}
 }}
function fruitPairs(){const a=FJ.items,n=a.length;
 for(let i=0;i<n;i++){const A=a[i];if(A.dead||A.merge>0)continue;
  for(let j=i+1;j<n;j++){const B=a[j];if(B.dead||B.merge>0)continue;
   let dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||0.0001,min=A.r+B.r;
   if(d>=min)continue;
   const nx=dx/d,ny=dy/d,ov=min-d,m1=A.r*A.r,m2=B.r*B.r,tm=m1+m2;
   A.x-=nx*ov*(m2/tm);A.y-=ny*ov*(m2/tm);B.x+=nx*ov*(m1/tm);B.y+=ny*ov*(m1/tm);
   const rv=(B.vx-A.vx)*nx+(B.vy-A.vy)*ny;
   if(rv<0){const e=0.18,jimp=-(1+e)*rv/(1/m1+1/m2);A.vx-=jimp/m1*nx;A.vy-=jimp/m1*ny;B.vx+=jimp/m2*nx;B.vy+=jimp/m2*ny;}
   const tx=-ny,ty=nx,tv=(B.vx-A.vx)*tx+(B.vy-A.vy)*ty,fr=0.25;
   if(Math.abs(tv)>0){const jfr=tv*fr/(1/m1+1/m2);A.vx+=jfr/m1*tx;A.vy+=jfr/m1*ty;B.vx-=jfr/m2*tx;B.vy-=jfr/m2*ty;}
  }
 }}
function fruitMerges(){if(FJ.busy)return;const a=FJ.items,n=a.length,slop=FJ.grown?2*FJ.scale:8*FJ.scale;
 for(let i=0;i<n;i++){const A=a[i];if(A.dead||A.merge>0)continue;
  for(let j=i+1;j<n;j++){const B=a[j];if(B.dead||B.merge>0)continue;
   if(A.type!==B.type||A.type>=FRUIT.length-1)continue;
   const d=Math.hypot(B.x-A.x,B.y-A.y);
   if(d<=A.r+B.r+slop){fruitBeginMerge(A,B);return;}
  }
 }}
function fruitBeginMerge(A,B){FJ.busy=true;const mx=(A.x+B.x)/2,my=(A.y+B.y)/2,nt=A.type+1;
 A.merge=B.merge=1;A.mx=B.mx=mx;A.my=B.my=my;A._nt=B._nt=nt;A._p=B;B._p=A;
}
function fruitTickMerge(h){let done=null;
 for(const f of FJ.items){if(f.merge<=0||f.dead)continue;f.merge+=h*5.8;f.x+=(f.mx-f.x)*0.22;f.y+=(f.my-f.y)*0.22;f.r*=0.985;if(f.merge>=1&&!done)done=f;}
 if(!done)return;
 const A=done,B=A._p,nt=A._nt,mx=A.mx,my=A.my,vx=((A.vx||0)+(B.vx||0))*0.25,vy=Math.min(0,((A.vy||0)+(B.vy||0))*0.2);
 A.dead=true;if(B)B.dead=true;FJ.busy=false;
 const nf=fruitAdd(nt,mx,my,vx,vy);nf.pop=0.35;nf.squash=0.28;

 if(FJ.grown){const now=performance.now();if(now<FJ.comboT)FJ.combo++;else FJ.combo=1;FJ.comboT=now+900;const pts=(nt+1)*10*FJ.combo;FJ.score+=pts;if(FJ.score>(S.fruitBest||0)){S.fruitBest=FJ.score;save();}
  if(nt>=3){lastPrefer.fruit=nt;gameStarCool(null,nt,600);}
 }
 else if(nt>=3){lastPrefer.fruit=nt;gameStarCool(null,nt,900);}
 if(nt===FRUIT.length-1){lastPrefer.fruit=nt;awardSticker("fruit");}
 window.__fruitMerges=(window.__fruitMerges||0)+1;window.__fruitLastMerge=nt;
}
function fruitJuice(x,y,nt){const F=FRUIT[nt],cv=$("fruitCV").getBoundingClientRect();
 const px=cv.left+x,py=cv.top+y;burst(px,py,[F[1],F[2],"#fff",FRUIT[Math.max(0,nt-1)][1]]);
 SFX.juicy(nt);rumble(lastPad,140,.45);say(F[0]+"!","poppy");window.__lastSfx="juicy";
 for(let k=0;k<10;k++){const a=k/10*6.28;FJ.pop.push({x:x,y:y,vx:Math.cos(a)*(80+nt*8)*FJ.scale,vy:Math.sin(a)*(80+nt*8)*FJ.scale,life:1,col:k%2?F[1]:F[2],s:6+nt});}
}
function fruitTickPop(dt){for(const p of FJ.pop){p.life-=dt*1.8;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;}FJ.pop=FJ.pop.filter(p=>p.life>0);}
function fruitTickDanger(dt){if(!FJ.grown||FJ.over||FJ.pouring)return;let danger=false;

}
function fruitTickFill(dt){if(FJ.grown||FJ.pouring||FJ.over)return;let high=false;
 for(const f of FJ.items){if(f.dead||f.merge>0)continue;if(f.y-f.r<FJ.line+FJ.H*0.04 && Math.abs(f.vy)<60)high=true;}
 if(FJ.items.length>18)high=true;

}
function fruitStartPour(){if(FJ.pouring)return;FJ.pouring=true;FJ.pourT=0;FJ.held=null;$("fruit").classList.add("pour");
 for(const f of FJ.items){f.vx+=(f.x-(FJ.left+FJ.right)/2)*1.2+ (Math.random()-.5)*220*FJ.scale;f.vy-=(220+Math.random()*180)*FJ.scale;}
 SFX.pour();SFX.cheer();rumble(lastPad,280,.55);say("All gone! More fruit!","poppy");window.__lastSfx="pour";window.__fruitPours=(window.__fruitPours||0)+1;

function fruitStepPour(dt){FJ.pourT+=dt;const g=1800*FJ.scale;
