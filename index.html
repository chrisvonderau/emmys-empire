<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Emmy's Empire</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Emmy's Empire">
<meta name="application-name" content="Emmy's Empire">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#8fd3ff">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' data: blob:">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe8ff;touch-action:none;overscroll-behavior:none;font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito",system-ui,sans-serif}
#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
svg{display:block}
/* ---------- home ---------- */
#scene{position:absolute;inset:0;width:100%;height:100%}
#bubbles{position:absolute;left:50%;top:19vh;transform:translateX(-50%);display:grid;grid-template-columns:repeat(4,var(--b));gap:3.2vh 2vw;--b:min(17vw,29vh)}
.bubble{position:relative;width:var(--b);height:var(--b);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,var(--c) 38%,var(--c2) 100%);box-shadow:0 1vh 0 rgba(0,0,0,.12),inset 0 -1vh 2vh rgba(0,0,0,.08);border:.6vh solid #fff;cursor:pointer;transition:transform .2s,box-shadow .2s}
.bubble svg{position:absolute;inset:12%;width:76%;height:76%;pointer-events:none}
.bubble.locked svg{filter:saturate(.55) brightness(1.06);opacity:.85}
.bubble.live{animation:breathe 2.2s ease-in-out infinite;box-shadow:0 1vh 0 rgba(0,0,0,.12),0 0 3vh 1vh rgba(255,236,140,.9)}
@keyframes breathe{50%{transform:scale(1.05)}}
.bubble.locked{animation:idlewig 5s ease-in-out infinite;animation-delay:var(--d)}
@keyframes idlewig{0%,82%,100%{transform:rotate(0)}85%{transform:rotate(-6deg)}88%{transform:rotate(6deg)}91%{transform:rotate(-4deg)}94%{transform:rotate(3deg)}}
.bubble.wobble{animation:wobble .65s ease!important}
@keyframes wobble{0%{transform:scale(1)}20%{transform:scale(1.14) rotate(-9deg)}40%{transform:scale(1.1) rotate(8deg)}60%{transform:scale(1.12) rotate(-5deg)}80%{transform:scale(1.08) rotate(3deg)}100%{transform:scale(1.08)}}
.bubble.sel{transform:scale(1.08);box-shadow:0 0 0 .8vh #fff,0 0 4vh 1.6vh #fff59a}
.bubble.sel.live::after{content:"";position:absolute;inset:-1.6vh;border-radius:50%;border:.7vh dashed #fff;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.soon{position:absolute;right:-4%;top:-6%;background:#fff;color:#ff5d8f;font-weight:800;font-size:calc(var(--b)*.13);padding:.3em .55em;border-radius:1em;box-shadow:0 .4vh 0 rgba(0,0,0,.12);transform:rotate(8deg);pointer-events:none;display:flex;align-items:center;gap:.25em}
.soon svg{position:static;width:.9em;height:.9em}
.bubble.wobble .soon{animation:soonpop .65s ease}
@keyframes soonpop{0%{transform:rotate(8deg) scale(1)}40%{transform:rotate(-4deg) scale(1.5)}100%{transform:rotate(8deg) scale(1.15)}}
.focus{outline:none;box-shadow:0 0 0 1vh #fff,0 0 5vh 2.4vh #ffe45c!important}
#emmy{position:absolute;left:.8vw;bottom:0;width:min(12.5vw,25vh);pointer-events:none}
#emmy .arm{transform-box:view-box;transform-origin:138px 188px;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(18deg)}}
#everett{position:absolute;right:.6vw;bottom:.5vh;width:min(13vw,27vh);cursor:pointer;border-radius:3vh}
#everett.bounce{animation:bounce .5s ease}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-3vh) rotate(-3deg)}60%{transform:translateY(0) rotate(2deg)}80%{transform:translateY(-1vh)}}
#everett .m2,#everett .m3{display:none}
#everett.giggle .m1,#everett.rasp .m1{display:none}
#everett.giggle .m2{display:inline}#everett.rasp .m3{display:inline}
/* ---------- hud ---------- */
#hud{position:absolute;top:max(1.5vh,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:1.6vw;z-index:20;pointer-events:none}
.pill{display:flex;align-items:center;gap:.8vh;background:rgba(255,255,255,.88);border-radius:6vh;padding:.6vh 2.2vh .6vh .8vh;font-weight:900;font-size:6vh;color:#5b4a8b;box-shadow:0 .6vh 0 rgba(0,0,0,.1);height:12vh}
.pill svg{height:10.5vh;width:10.5vh}
#jarPill{pointer-events:auto;cursor:pointer}
.bump{animation:bumpk .45s ease}
@keyframes bumpk{40%{transform:scale(1.25)}}
#gear{position:absolute;top:max(1.5vh,env(safe-area-inset-top));right:max(1.5vh,env(safe-area-inset-right));width:9vh;height:9vh;border-radius:50%;background:conic-gradient(#ff7aa8 calc(var(--p,0)*1turn),rgba(255,255,255,.6) 0);display:flex;align-items:center;justify-content:center;z-index:25;cursor:pointer}
#gear svg{width:70%;height:70%}
/* ---------- paint ---------- */
#paint{background:#fff}
#paper{position:absolute;inset:0;width:100%;height:100%;touch-action:none;background:#fff;cursor:crosshair}
.ui{position:absolute;z-index:10}
#rail{left:max(1.2vh,env(safe-area-inset-left));top:max(1.2vh,env(safe-area-inset-top));display:flex;flex-direction:column;gap:1.6vh}
.tbtn{--s:min(14vh,11vw);width:var(--s);height:var(--s);border-radius:50%;background:#fff;border:.6vh solid #e8e2ff;box-shadow:0 .7vh 0 rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:transform .15s}
.tbtn svg{width:72%;height:72%;pointer-events:none}
.tbtn.on{border-color:#ffcf3f;box-shadow:0 0 0 .7vh #fff3b0,0 .7vh 0 rgba(0,0,0,.12);transform:scale(1.08)}
#castleBtn{background:conic-gradient(#7ad37a calc(var(--p,0)*1turn),#fff 0);border-color:#d6f5d6}
#palette{left:50%;transform:translateX(-50%);bottom:max(1.2vh,env(safe-area-inset-bottom));display:flex;gap:calc(var(--ps)*.12);--ps:min(18vh,calc((100vw - min(14vh,11vw) - 6vw)/9));padding-left:calc(min(14vh,11vw)*.6)}
.pot{width:var(--ps);height:var(--ps);border-radius:50%;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.75) 0,rgba(255,255,255,0) 30%),var(--c);border:.6vh solid #fff;box-shadow:0 .7vh 0 rgba(0,0,0,.18);cursor:pointer;transition:transform .15s}
.pot.on{transform:translateY(-2.2vh) scale(1.12);box-shadow:0 0 0 .8vh var(--c),0 1vh 0 rgba(0,0,0,.18)}
#newBtn{position:absolute;right:max(1.2vh,env(safe-area-inset-right));top:max(1.2vh,env(safe-area-inset-top));--s:min(17vh,13vw);background:#fff6d8;border-color:#ffd56b}
#sunny{right:max(1vh,env(safe-area-inset-right));top:calc(min(17vh,13vw) + 4vh);width:min(16vh,12vw);cursor:pointer}
#sunny.talk{animation:bounce .5s ease}
.cursor{position:absolute;z-index:30;width:9vh;height:9vh;margin:-4.5vh 0 0 -4.5vh;border-radius:50%;border:1vh solid var(--c,#333);box-shadow:0 0 0 .5vh #fff,0 0 3vh #fff;pointer-events:none;display:none}
.cursor.show{display:block}
.cursor::after{content:"";position:absolute;inset:30%;border-radius:50%;background:var(--c,#333)}
#wipe{position:absolute;top:0;bottom:0;left:0;width:140vw;z-index:15;pointer-events:none;transform:translateX(-140vw);display:none}
#wipe.go{display:block;animation:wipe 1s linear forwards}
@keyframes wipe{to{transform:translateX(100vw)}}
/* ---------- fx ---------- */
.flystar{position:fixed;z-index:60;width:9vh;height:9vh;margin:-4.5vh 0 0 -4.5vh;pointer-events:none;transition:transform .75s cubic-bezier(.5,-0.4,.6,1),opacity .2s .7s}
.spark{position:fixed;z-index:55;width:3vh;height:3vh;margin:-1.5vh;border-radius:50%;pointer-events:none;animation:spark .6s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
#stickerPop{position:fixed;left:50%;top:50%;width:min(40vh,30vw);height:min(40vh,30vw);margin:calc(min(40vh,30vw)/-2);z-index:70;pointer-events:none;display:none}
#stickerPop.go{display:block;animation:spop 2.4s ease forwards}
@keyframes spop{0%{transform:scale(0) rotate(-30deg)}18%{transform:scale(1.2) rotate(8deg)}28%{transform:scale(1) rotate(0)}70%{transform:scale(1) rotate(0);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(.15);opacity:.3}}
.confetti{position:fixed;top:-5vh;width:2vh;height:3vh;z-index:65;pointer-events:none;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(80,60,140,.45)}
.ov.on{display:flex;animation:fadein .25s}
.card{background:#fffaf0;border-radius:5vh;padding:4vh 4vw;box-shadow:0 2vh 0 rgba(0,0,0,.15);position:relative;max-width:92vw;max-height:94vh}
.close{position:absolute;right:-2vh;top:-2vh;width:14vh;height:14vh;border-radius:50%;background:#7ad37a;border:.8vh solid #fff;box-shadow:0 .7vh 0 rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;cursor:pointer}
.close svg{width:60%;height:60%;pointer-events:none}
#bookGrid{display:grid;grid-template-columns:repeat(4,min(18vh,17vw));gap:3vh 3vw;margin-top:1vh}
.slot{width:min(18vh,17vw);height:min(18vh,17vw);border-radius:3vh;display:flex;align-items:center;justify-content:center;cursor:pointer}
.slot svg{width:96%;height:96%;pointer-events:none}
.slot.empty svg{opacity:.35}
.bookHead{display:flex;align-items:center;gap:2vh;justify-content:center}
.bookHead svg{height:13vh;width:13vh}
#parentCard{font-size:3.4vh;color:#4a3c78;min-width:min(70vw,620px)}
#parentCard h2{margin:0 0 2vh;font-size:4.5vh}
.prow{display:flex;align-items:center;justify-content:space-between;gap:3vw;margin:2.2vh 0}
.prow input[type=range]{width:40%;height:5vh}
.pb{font:inherit;font-weight:800;border:0;border-radius:3vh;padding:1.5vh 3vh;background:#e8e2ff;color:#4a3c78;cursor:pointer;min-height:8vh}
.pb.warn{background:#ffd9d9;color:#a12f2f}
.pnote{font-size:2.6vh;opacity:.75}
#rotate{position:fixed;inset:0;z-index:200;background:#bfe8ff;display:none;align-items:center;justify-content:center;flex-direction:column}
#rotate svg{width:min(70vw,60vh)}
@media (orientation:portrait){#rotate{display:flex}}
#rotPhone{transform-box:fill-box;transform-origin:center;animation:rot 2.4s ease-in-out infinite}
@keyframes rot{0%,25%{transform:rotate(0)}55%,85%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
</style>
</head>

/* ================= hud ================= */
function updHud(bump){$("starN").textContent=S.stars;const n=S.stickers.paint.length;$("jarN").textContent=n;const h=Math.round(72*n/8);const f=$("jarFill");f.setAttribute("y",94-h);f.setAttribute("height",h);
 let d="";S.stickers.paint.forEach((id,k)=>{d+='<circle cx="'+(28+(k%4)*15)+'" cy="'+(86-Math.floor(k/4)*14)+'" r="6" fill="'+COLORS[id][1]+'"/>';});$("jarDots").innerHTML=d;
 if(bump){const p=$(bump);p.classList.remove("bump");void p.offsetWidth;p.classList.add("bump");}}
/* ================= stars & stickers ================= */
function burst(x,y,cols){for(let k=0;k<10;k++){const s=document.createElement("div");s.className="spark";s.style.left=x+"px";s.style.top=y+"px";s.style.background=cols[k%cols.length];const a=k/10*6.28;s.style.setProperty("--dx",Math.cos(a)*90+"px");s.style.setProperty("--dy",Math.sin(a)*90+"px");document.body.appendChild(s);setTimeout(()=>s.remove(),700);}}
let lastCheer=0;
function earnStar(x,y){S.stars++;save();const award=S.stars%5===0,myN=S.stars;window.__starsEarned=(window.__starsEarned||0)+1;const st=document.createElement("div");st.className="flystar";st.innerHTML='<svg viewBox="0 0 100 100"><use href="#starShape"/></svg>';st.style.left=x+"px";st.style.top=y+"px";document.body.appendChild(st);
 const t=$("starPill").querySelector("svg").getBoundingClientRect();requestAnimationFrame(()=>requestAnimationFrame(()=>{st.style.transform="translate("+(t.left+t.width/2-x)+"px,"+(t.top+t.height/2-y)+"px) scale(.8) rotate(360deg)";st.style.opacity="0";}));
 setTimeout(()=>{st.remove();updHud("starPill");SFX.chime();rumble(lastPad,90,.3);
  if(award)awardSticker();else if(Date.now()-lastCheer>9000&&screen==="paint"){lastCheer=Date.now();say(["Wow!","So pretty!","Great painting!","You got a star!"][myN%4],"sunny");}},800);}
function awardSticker(){const own=S.stickers.paint;let next=-1;for(let k=0;k<8;k++)if(own.indexOf(k)<0){next=k;break;}
 if(next<0){confetti();say("Hooray! Another star party!","sunny");return;}
 own.push(next);save();const sp=$("stickerPop");sp.innerHTML=splatSVG(next,COLORS[next][1]);const j=$("jarPill").getBoundingClientRect();sp.style.setProperty("--tx",(j.left+j.width/2-innerWidth/2)+"px");sp.style.setProperty("--ty",(j.top+j.height/2-innerHeight/2)+"px");sp.classList.remove("go");void sp.offsetWidth;sp.classList.add("go");SFX.fanfare();rumble(lastPad,300,.7);
 say("A "+COLORS[next][0].toLowerCase()+" splat sticker!","sunny");setTimeout(()=>{sp.classList.remove("go");updHud("jarPill");if(own.length===8){confetti();setTimeout(()=>say("Your sticker page is full! Sticker parade!","sunny"),400);}},2400);}
function confetti(){const cols=COLORS.map(c=>c[1]);for(let k=0;k<70;k++){const c=document.createElement("div");c.className="confetti";c.style.left=Math.random()*100+"vw";c.style.background=cols[k%8];c.style.animationDelay=(Math.random()*.8)+"s";c.style.borderRadius=k%2?"50%":"3px";document.body.appendChild(c);setTimeout(()=>c.remove(),3600);}SFX.fanfare();}
/* ================= sticker book ================= */
let bookFocus=null;
function openBook(){const g=$("bookGrid");g.innerHTML="";$("bookHead").innerHTML='<svg viewBox="0 0 100 100">'+ICONS.paint+'</svg>';
 for(let k=0;k<8;k++){const has=S.stickers.paint.indexOf(k)>=0;const d=document.createElement("div");d.className="slot padable"+(has?"":" empty");d.innerHTML='<svg viewBox="0 0 100 100">'+splatSVG(k,COLORS[k][1],!has)+'</svg>';d.addEventListener("pointerdown",e=>{e.preventDefault();bookTap(d,k,has);});d._act=()=>bookTap(d,k,has);g.appendChild(d);}
 $("bookClose").innerHTML=CHECK;$("book").classList.add("on");SFX.pop();say("Your sticker book!","home");bookFocus=null;if(padMode){setBookFocus(g.firstChild);}}
function bookTap(d,k,has){wobble(d);if(has){SFX.pick(k);say(COLORS[k][0]+" splat!","sunny");}else{SFX.tick();say("Paint more to get this one!","sunny");}}
function closeBook(){$("book").classList.remove("on");SFX.pop();clearFocus();if(padMode&&screen==="home")setHomeFocus($("jarPill"),false);}
function setBookFocus(el){clearFocus();el.classList.add("focus");bookFocus=el;}
$("bookClose").addEventListener("pointerdown",e=>{e.preventDefault();closeBook();});$("bookClose")._act=closeBook;
/* ================= parent corner ================= */
function holdButton(el,ms,done){let t0=0,raf=0,active=false;const tick=()=>{if(!active)return;const p=Math.min(1,(performance.now()-t0)/ms);el.style.setProperty("--p",p);if(p>=1){active=false;el.style.setProperty("--p",0);done();return;}raf=requestAnimationFrame(tick);};
 const stop=()=>{active=false;cancelAnimationFrame(raf);el.style.setProperty("--p",0);};
 el.addEventListener("pointerdown",e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}active=true;t0=performance.now();tick();});["pointerup","pointercancel","lostpointercapture"].forEach(ev=>el.addEventListener(ev,stop));}
holdButton($("gear"),3000,openParent);
let resetArm=0;
function openParent(){$("vol").value=Math.round(S.volume*100);$("narrBtn").textContent=S.narrator?"On":"Off";$("resetBtn").textContent="Reset";resetArm=0;$("parentClose").innerHTML=CHECK;$("parent").classList.add("on");}
function closeParent(){$("parent").classList.remove("on");}
$("vol").addEventListener("input",e=>{S.volume=e.target.value/100;if(MG)MG.gain.value=S.volume;save();});
$("vol").addEventListener("change",()=>SFX.chime());
$("narrBtn").addEventListener("click",()=>{S.narrator=!S.narrator;if(!S.narrator&&SS)try{SS.cancel();}catch(e){}$("narrBtn").textContent=S.narrator?"On":"Off";save();say("Hello!","home");});
$("resetBtn").addEventListener("click",()=>{if(Date.now()-resetArm>4000){resetArm=Date.now();$("resetBtn").textContent="Tap again to reset";return;}S.stars=0;S.stickers={paint:[]};S.paintDist=0;save();updHud();$("resetBtn").textContent="Done";resetArm=0;});
$("parentClose").addEventListener("pointerdown",e=>{e.preventDefault();closeParent();});
/* ================= paint ================= */
const cv=$("paper"),cx=cv.getContext("2d");let DPR=1,W=0,H=0;
function brushW(){return Math.max(22,Math.min(W,H)*.06);}
function stampS(){return Math.max(60,Math.min(W,H)*.17);}
function sizePaper(){const w=innerWidth,h=innerHeight;if(w===W&&h===H&&cv.width)return;const old=document.createElement("canvas");old.width=cv.width;old.height=cv.height;if(cv.width)old.getContext("2d").drawImage(cv,0,0);
 DPR=Math.min(2,window.devicePixelRatio||1);W=w;H=h;cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);cx.setTransform(1,0,0,1,0,0);cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);if(old.width)cx.drawImage(old,0,0);cx.setTransform(DPR,0,0,DPR,0,0);}
function restorePaper(){try{const d=localStorage.getItem(PKEY);if(!d)return;const im=new Image();im.onload=()=>{cx.drawImage(im,0,0,W,H);};im.src=d;}catch(e){}}
let saveT=0;function savePaperSoon(){clearTimeout(saveT);saveT=setTimeout(()=>{try{const s=Math.min(1,1200/W),c=document.createElement("canvas");c.width=Math.round(W*s);c.height=Math.round(H*s);c.getContext("2d").drawImage(cv,0,0,c.width,c.height);localStorage.setItem(PKEY,c.toDataURL("image/jpeg",.8));}catch(e){}},1200);}
(function buildPaint(){const rail=$("rail");$("castleBtn").innerHTML=CASTLE;
 TOOLS.forEach(t=>{const b=document.createElement("div");b.className="tbtn padable";b.dataset.tool=t[0];b.innerHTML=toolIcon(t[0]);b.addEventListener("pointerdown",e=>{e.preventDefault();setTool(t[0],true);});b._act=()=>setTool(t[0],true);rail.appendChild(b);});
 const pal=$("palette");COLORS.forEach((c,i)=>{const p=document.createElement("div");p.className="pot padable";p.style.setProperty("--c",c[1]);p.setAttribute("aria-label",c[0]);p.addEventListener("pointerdown",e=>{e.preventDefault();pickColor(i,p);});p._act=()=>pickColor(i,p);pal.appendChild(p);});
 $("newBtn").innerHTML=NEWP;$("newBtn").addEventListener("pointerdown",e=>{e.preventDefault();newPaper();});$("newBtn")._act=newPaper;
 $("sunny").addEventListener("pointerdown",e=>{e.preventDefault();sunnyTalk();});$("sunny")._act=sunnyTalk;
 holdButton($("castleBtn"),900,goHome);})();
function sunnyTalk(){const s=$("sunny");s.classList.remove("talk");void s.offsetWidth;s.classList.add("talk");SFX.boing();say(["Let's paint!","I'm Sunny!","Pick a color!","Wiggle wiggle!"][Math.random()*4|0],"sunny");}
let lastColorStar=0;
function pickColor(i,el,quiet){const changed=i!==S.color;S.color=i;save();document.querySelectorAll(".pot").forEach((p,k)=>p.classList.toggle("on",k===i));$("sunnyPaint").setAttribute("fill",COLORS[i][1]);
 document.querySelectorAll(".tbtn[data-tool]").forEach(b=>{if(b.dataset.tool!=="brush")b.innerHTML=toolIcon(b.dataset.tool,COLORS[i][1]);else b.innerHTML=toolIcon("brush",COLORS[i][1]);});
 for(let k=0;k<4;k++)$("cur"+k).style.setProperty("--c",COLORS[i][1]);
 if(quiet)return;SFX.pick(i);rumble(lastPad,60,.2);say(COLORS[i][0]+"!","sunny");
 if(changed&&Date.now()-lastColorStar>5000){lastColorStar=Date.now();const r=(el||document.querySelectorAll(".pot")[i]).getBoundingClientRect();earnStar(r.left+r.width/2,r.top+r.height/2);}}
function setTool(t,speak){S.tool=t;save();document.querySelectorAll(".tbtn[data-tool]").forEach(b=>b.classList.toggle("on",b.dataset.tool===t));if(speak){SFX.pop();say(TOOLS.find(x=>x[0]===t)[1],"sunny");}}
function addDist(d){S.paintDist+=d;const need=Math.max(W,H)*2.4;while(S.paintDist>=need){S.paintDist-=need;earnStar(Math.min(W-60,Math.max(60,lastX)),Math.min(H-60,Math.max(60,lastY)));}}
let lastX=0,lastY=0,distSaveT=0;
function seg(x0,y0,x1,y1){cx.strokeStyle=COLORS[S.color][1];cx.lineWidth=brushW();cx.lineCap="round";cx.lineJoin="round";cx.beginPath();cx.moveTo(x0,y0);cx.lineTo(x1,y1);cx.stroke();const d=Math.hypot(x1-x0,y1-y0);lastX=x1;lastY=y1;addDist(d);clearTimeout(distSaveT);distSaveT=setTimeout(save,800);}
function dot(x,y){cx.fillStyle=COLORS[S.color][1];cx.beginPath();cx.arc(x,y,brushW()/2,0,6.284);cx.fill();lastX=x;lastY=y;addDist(brushW());}
function stamp(x,y){const s=stampS(),c=COLORS[S.color][1];cx.save();cx.translate(x,y);cx.rotate((Math.random()-.5)*.5);cx.fillStyle=c;cx.beginPath();
 if(S.tool==="star"){for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,r=k%2?s*.22:s*.5;cx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}cx.closePath();}
 else if(S.tool==="heart"){const h=s*.5;cx.moveTo(0,h*.85);cx.bezierCurveTo(-h*1.25,h*.05,-h*.9,-h*.95,0,-h*.35);cx.bezierCurveTo(h*.9,-h*.95,h*1.25,h*.05,0,h*.85);}
 else cx.arc(0,0,s*.45,0,6.284);
 cx.fill();cx.restore();SFX.stamp();lastX=x;lastY=y;burst(x,y,[c,"#fff",c]);addDist(Math.max(W,H)*.35);save();savePaperSoon();}
const strokes=new Map();
function pDown(id,x,y){if(S.tool!=="brush"){stamp(x,y);return;}strokes.set(id,{x,y});dot(x,y);}
function pMove(id,x,y){const s=strokes.get(id);if(!s)return;if(Math.hypot(x-s.x,y-s.y)<1.5)return;seg(s.x,s.y,x,y);s.x=x;s.y=y;}
function pUp(id){if(strokes.delete(id))savePaperSoon();}
cv.addEventListener("pointerdown",e=>{e.preventDefault();padMode=false;hideCursors();try{cv.setPointerCapture(e.pointerId);}catch(_){}pDown("p"+e.pointerId,e.clientX,e.clientY);});
cv.addEventListener("pointermove",e=>{if(!strokes.has("p"+e.pointerId))return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];(evs.length?evs:[e]).forEach(ev=>pMove("p"+e.pointerId,ev.clientX,ev.clientY));});
["pointerup","pointercancel","lostpointercapture"].forEach(ev=>cv.addEventListener(ev,e=>pUp("p"+e.pointerId)));
let wiping=false;
function newPaper(){if(wiping)return;wiping=true;const w=$("wipe");w.classList.remove("go");void w.offsetWidth;w.classList.add("go");SFX.whoosh();rumble(lastPad,400,.5);say("New paper!","sunny");
 setTimeout(()=>{cx.setTransform(1,0,0,1,0,0);cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.setTransform(DPR,0,0,DPR,0,0);try{localStorage.removeItem(PKEY);}catch(e){}},500);
 setTimeout(()=>{w.classList.remove("go");wiping=false;},1050);}
let restored=false;
function openGame(id){if(id!=="paint")return;S.lastGame="paint";save();show("paint");if(!restored){restored=true;restorePaper();}setTool(S.tool||"brush");pickColor(S.color,null,true);SFX.fanfare();say("Hi! I'm Sunny! Let's paint!","sunny");}
function goHome(){strokes.clear();savePaperSoon();show("home");selIdx=-1;bubbles.forEach(b=>b.classList.remove("sel"));SFX.pop();rumble(lastPad,120,.3);say("Home!","home");if(padMode)setHomeFocus(bubbles[0],false);}
/* ================= gamepad ================= */
const prev={},curs={};let repT={},lastT=performance.now();
function hideCursors(){for(let k=0;k<4;k++)$("cur"+k).classList.remove("show");}
function btn(p,i){const b=p.buttons&&p.buttons[i];return !!b&&(b.pressed||b.value>.5);}
function getPads(){let ps=[];try{ps=navigator.getGamepads?navigator.getGamepads():[];}catch(e){}const out=[];for(let i=0;i<(ps?ps.length:0);i++){const p=ps[i];if(p&&p.connected!==false)out.push(p);}return out;}
function dirOf(p){const ax=p.axes||[],x=ax[0]||0,y=ax[1]||0;if(btn(p,14)||x<-.55)return"left";if(btn(p,15)||x>.55)return"right";if(btn(p,12)||y<-.55)return"up";if(btn(p,13)||y>.55)return"down";return null;}
function anyOverlay(){return $("parent").classList.contains("on")?"parent":$("book").classList.contains("on")?"book":null;}
function loop(t){const dt=Math.min(.05,(t-lastT)/1000);lastT=t;const pads=getPads();window.__padsSeen=pads.length;
 pads.forEach(p=>{const k=p.index,pr=prev[k]||(prev[k]={b:[],dir:null,dirT:0});const now=[];for(let i=0;i<17;i++)now[i]=btn(p,i);const edge=i=>now[i]&&!pr.b[i];
  if(now.some(x=>x))lastPad=p;
  const ov=anyOverlay(),d=dirOf(p);let fire=null;if(d){if(d!==pr.dir){fire=d;pr.dirT=t+320;}else if(t>pr.dirT){fire=d;pr.dirT=t+190;}}pr.dir=d;
  if(ov==="parent"){if(edge(1))closeParent();}
  else if(ov==="book"){if(fire){padMode=true;const items=[...document.querySelectorAll("#bookGrid .slot")].concat([$("bookClose")]);const n=bookFocus?spatial(bookFocus,items,fire):items[0];if(n){setBookFocus(n);SFX.tick();}else if(!bookFocus)setBookFocus(items[0]);}
   if(edge(0)){if(bookFocus&&bookFocus._act)bookFocus._act();else closeBook();}if(edge(1))closeBook();}
  else if(screen==="home"){if(fire){lastPad=p;const items=homeItems();let n;if(!padMode||!homeFocus||!homeFocus.classList.contains("focus"))n=bubbles[Math.max(0,selIdx)];else n=spatial(homeFocus,items,fire);if(n){setHomeFocus(n,true);if(!n.classList.contains("bubble"))SFX.tick();}}
   if(edge(0)){lastPad=p;if(!padMode||!homeFocus||!homeFocus.classList.contains("focus")){setHomeFocus(bubbles[Math.max(0,selIdx)],true);}else if(homeFocus.classList.contains("bubble")){const i=+homeFocus.dataset.i;if(selIdx!==i)tapBubble(i,true);tapBubble(i,true);}else if(homeFocus.id==="everett")tapEverett();else if(homeFocus.id==="jarPill")openBook();}
   if(edge(1)){selIdx=-1;bubbles.forEach(b=>b.classList.remove("sel"));SFX.tick();}
   if(edge(2))tapEverett();if(edge(3))openBook();}
  else if(screen==="paint")padPaint(p,k,now,edge,dt);
  pr.b=now;});
 requestAnimationFrame(loop);}
function padPaint(p,k,now,edge,dt){const c=curs[k]||(curs[k]={x:W/2+k*40,y:H/2,shown:false,painting:false});const el=$("cur"+(k%4));const ax=p.axes||[];let x=ax[0]||0,y=ax[1]||0;const m=Math.hypot(x,y);
 if(m<.18){x=0;y=0;}else{const s=(m-.18)/(1-.18)/m;x*=s;y*=s;}
 if(btn(p,14))x=-1;if(btn(p,15))x=1;if(btn(p,12))y=-1;if(btn(p,13))y=1;
 const sp=Math.min(W,H)*1.1;if(x||y||now.some(b=>b)){if(!c.shown){c.shown=true;}el.classList.add("show");padMode=true;}
 c.x=Math.max(0,Math.min(W,c.x+x*sp*dt));c.y=Math.max(0,Math.min(H,c.y+y*sp*dt));el.style.left=c.x+"px";el.style.top=c.y+"px";
 if(edge(4)){pickColor((S.color+7)%8);}if(edge(5)){pickColor((S.color+1)%8);}
 if(edge(3))newPaper();if(edge(2)){const i=TOOLS.findIndex(t=>t[0]===S.tool);setTool(TOOLS[(i+1)%4][0],true);}
 if(edge(1)){pUp("g"+k);goHome();return;}
 const id="g"+k;
 if(edge(0)){el.style.display="none";const under=document.elementFromPoint(c.x,c.y);el.style.display="";const ui=under&&under.closest&&under.closest(".padable");
  if(ui&&ui._act){ui._act();c.uiPress=true;}else{c.uiPress=false;pDown(id,c.x,c.y);rumble(p,60,.25);}}
 else if(now[0]&&!c.uiPress){pMove(id,c.x,c.y);}
 if(!now[0])pUp(id);}
window.addEventListener("gamepadconnected",e=>{lastPad=e.gamepad;SFX.tick();});
window.addEventListener("gamepaddisconnected",e=>{const k=e.gamepad&&e.gamepad.index;if(k!=null){delete prev[k];if(curs[k]){pUp("g"+k);$("cur"+(k%4)).classList.remove("show");delete curs[k];}}});
/* keyboard (Mac without controller) */
window.addEventListener("keydown",e=>{if(screen!=="home"||anyOverlay())return;const m={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down"}[e.key];if(m){e.preventDefault();const n=(padMode&&homeFocus&&homeFocus.classList.contains("focus"))?spatial(homeFocus,homeItems(),m):bubbles[0];if(n)setHomeFocus(n,true);}
 else if(e.key==="Enter"||e.key===" "){e.preventDefault();if(homeFocus&&homeFocus.classList&&homeFocus.classList.contains("bubble"))tapBubble(+homeFocus.dataset.i,true);}});
/* ================= misc ================= */
["gesturestart","gesturechange","dblclick","contextmenu"].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener("touchmove",e=>{if(!e.target.closest||!e.target.closest("input"))e.preventDefault();},{passive:false});
window.addEventListener("resize",()=>{if(screen==="paint")sizePaper();});
document.addEventListener("visibilitychange",()=>{if(document.hidden){try{SS&&SS.cancel();}catch(e){}save();}});
window.__ee={get state(){return S;},get screen(){return screen;},openGame,goHome,earnStar,newPaper,pickColor};
/* ================= boot ================= */
updHud();sizePaper();
if(S.lastGame==="paint"){show("paint");setTool(S.tool||"brush");pickColor(S.color,null,true);restored=true;restorePaper();}else{show("home");}
requestAnimationFrame(loop);
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
})();
</script>
</body>
